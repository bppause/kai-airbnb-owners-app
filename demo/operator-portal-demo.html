<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kai · Operator Portal — Clickable Demo</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .nav-item.active { background:#0f172a; color:#fff; }
  .pill { display:inline-flex; align-items:center; gap:.35rem; padding:.15rem .55rem; border-radius:9999px; font-size:.7rem; font-weight:600; }
  .pill-green { background:#dcfce7; color:#166534; }
  .pill-amber { background:#fef3c7; color:#92400e; }
  .pill-red { background:#fee2e2; color:#991b1b; }
  .pill-blue { background:#dbeafe; color:#1e40af; }
  .pill-gray { background:#e5e7eb; color:#374151; }
  .pill-violet { background:#ede9fe; color:#5b21b6; }
  .step-dot { width:1.5rem; height:1.5rem; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; }
  .fade-in { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform:none;} }
  .demo-banner { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
  details>summary { cursor:pointer; list-style:none; }
  details>summary::-webkit-details-marker { display:none; }
  .clickable-hint { box-shadow: 0 0 0 0 rgba(99,102,241,.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(99,102,241,.5); }
    70% { box-shadow: 0 0 0 8px rgba(99,102,241,0); }
    100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
  }
</style>
</head>
<body class="bg-slate-50 text-slate-900">

<!-- Demo banner -->
<div class="demo-banner text-white text-center text-xs py-1.5 px-3">
  <span data-i18n="banner"></span>
</div>

<!-- Top bar -->
<header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-30">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-slate-900 text-white grid place-items-center font-bold">K</div>
    <div>
      <div class="font-semibold text-sm">Kai · <span data-i18n="appName"></span></div>
      <div class="text-[11px] text-slate-500" data-i18n="tagline"></div>
    </div>
  </div>
  <div class="flex items-center gap-2">
    <!-- Role switcher -->
    <div class="hidden md:flex items-center bg-slate-100 rounded-lg p-1 text-xs font-medium">
      <button data-role="operator" class="role-btn px-3 py-1.5 rounded-md" data-i18n="role.operator"></button>
      <button data-role="owner" class="role-btn px-3 py-1.5 rounded-md" data-i18n="role.owner"></button>
      <button data-role="admin" class="role-btn px-3 py-1.5 rounded-md" data-i18n="role.admin"></button>
    </div>
    <!-- Lang switcher -->
    <div class="flex items-center bg-slate-100 rounded-lg p-1 text-xs font-semibold">
      <button data-lang="es" class="lang-btn px-2.5 py-1 rounded-md">ES</button>
      <button data-lang="en" class="lang-btn px-2.5 py-1 rounded-md">EN</button>
    </div>
  </div>
</header>

<div class="flex">
  <!-- Sidebar -->
  <aside class="w-56 shrink-0 hidden md:block bg-white border-r border-slate-200 min-h-[calc(100vh-89px)] p-3">
    <div class="text-[10px] uppercase tracking-wider text-slate-500 px-2 mb-2" data-i18n="nav.operator"></div>
    <nav id="nav-operator" class="space-y-0.5 text-sm">
      <button data-view="op-dashboard" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>🏠</span><span data-i18n="nav.dashboard"></span></button>
      <button data-view="op-units" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>🏢</span><span data-i18n="nav.units"></span></button>
      <button data-view="op-unit-detail" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>📋</span><span data-i18n="nav.unitDetail"></span></button>
      <button data-view="op-service-requests" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>🔧</span><span data-i18n="nav.serviceRequests"></span></button>
      <button data-view="op-service-detail" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>📝</span><span data-i18n="nav.serviceDetail"></span></button>
      <button data-view="op-pricing" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>💰</span><span data-i18n="nav.pricing"></span></button>
      <button data-view="op-staff" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>👷</span><span data-i18n="nav.staff"></span></button>
      <button data-view="op-propose" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>➕</span><span data-i18n="nav.propose"></span></button>
    </nav>
    <div class="text-[10px] uppercase tracking-wider text-slate-500 px-2 mt-5 mb-2" data-i18n="nav.owner"></div>
    <nav id="nav-owner" class="space-y-0.5 text-sm">
      <button data-view="own-listing" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>🏡</span><span data-i18n="nav.myListing"></span></button>
      <button data-view="own-approval" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>✅</span><span data-i18n="nav.approval"></span></button>
      <button data-view="own-block" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>📅</span><span data-i18n="nav.ownerBlock"></span></button>
    </nav>
    <div class="text-[10px] uppercase tracking-wider text-slate-500 px-2 mt-5 mb-2" data-i18n="nav.admin"></div>
    <nav id="nav-admin" class="space-y-0.5 text-sm">
      <button data-view="adm-operators" class="nav-item w-full text-left px-3 py-2 rounded-md hover:bg-slate-100 flex items-center gap-2"><span>🛡️</span><span data-i18n="nav.opMgmt"></span></button>
    </nav>
    <div class="mt-6 p-3 rounded-lg bg-indigo-50 border border-indigo-100 text-xs text-indigo-900">
      <div class="font-semibold mb-1" data-i18n="hint.title"></div>
      <div data-i18n="hint.body"></div>
    </div>
  </aside>

  <!-- Main view container -->
  <main class="flex-1 p-6 max-w-[1200px] mx-auto w-full" id="view-container"></main>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity z-50"></div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-40 p-4">
  <div class="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 fade-in" id="modal-content"></div>
</div>

function kpi(icon, num, label, accent) {
  return `<div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="w-9 h-9 rounded-lg ${accent} grid place-items-center text-lg mb-2">${icon}</div>
    <div class="text-2xl font-bold leading-none">${num}</div>
    <div class="text-xs text-slate-500 mt-1">${label}</div>
  </div>`;
}
function attentionRow(emoji, ref, sub, title, kind, badgeKey, target) {
  return `<div data-go="${target}" class="cursor-pointer flex items-center justify-between gap-3 p-3 rounded-lg border border-slate-100 hover:border-indigo-300 hover:bg-indigo-50/40">
    <div class="flex items-center gap-3 min-w-0">
      <span class="text-xl">${emoji}</span>
      <div class="min-w-0">
        <div class="font-medium text-sm truncate">${title}</div>
        <div class="text-xs text-slate-500 truncate">${ref} · ${sub}</div>
      </div>
    </div>
    ${pill(badgeKey, kind)}
  </div>`;
}
function communityBar(name, occupied, totalBars) {
  const dots = Array.from({length: totalBars}, (_,i) =>
    `<div class="h-2 rounded-sm ${i<occupied?'bg-indigo-500':'bg-slate-200'}"></div>`).join('');
  return `<div>
    <div class="flex justify-between text-xs mb-1"><span>${name}</span><span class="text-slate-400">${occupied} / ${totalBars}</span></div>
    <div class="grid grid-cols-8 gap-1">${dots}</div>
  </div>`;
}
function unitRow(apt, community, statusHtml, next, isHot=false) {
  return `<tr class="hover:bg-slate-50 cursor-pointer ${isHot?'bg-red-50/40':''}" data-go="op-unit-detail">
    <td class="px-4 py-3 font-medium">${apt}</td>
    <td class="px-4 py-3 text-slate-600">${community}</td>
    <td class="px-4 py-3">${statusHtml}</td>
    <td class="px-4 py-3 text-slate-600">${next}</td>
    <td class="px-4 py-3 text-right text-xs text-indigo-600">${state.lang==='es'?'Abrir':'Open'} →</td>
  </tr>`;
}
function srRow(id, title, unit, typeKey, urgKey, statusKey, cost, isHot=false) {
  const urgKind = urgKey==='urg.emergency' ? 'red' : urgKey==='urg.urgent' ? 'amber' : 'blue';
  const statKind = statusKey==='status.awaiting' ? 'amber' : statusKey==='status.inProgress' ? 'violet' : statusKey==='status.assigned' ? 'blue' : 'gray';
  return `<tr class="hover:bg-slate-50 cursor-pointer ${isHot?'bg-red-50/40':''}" data-go="op-service-detail">
    <td class="px-4 py-3"><div class="font-medium">${title}</div><div class="text-xs text-slate-500 font-mono">#${id}</div></td>
    <td class="px-4 py-3 text-slate-600">${unit}</td>
    <td class="px-4 py-3">${pill(typeKey,'gray')}</td>

    <td class="px-4 py-3 text-right font-medium">${cost}</td>

function tl(num, color, text, when, done=false, current=false) {
  const colorMap = { green:'bg-emerald-500 text-white', amber:'bg-amber-500 text-white', gray:'bg-slate-200 text-slate-500' };
  return `<li class="relative">
    <span class="absolute -left-[31px] top-0 step-dot ${colorMap[color]} ${current?'clickable-hint':''}">${done?'✓':num}</span>
    <div class="font-medium ${color==='gray'?'text-slate-400':''}">${text}</div>
    <div class="text-xs text-slate-500">${when}</div>
  </li>`;
}
function attachThumb(emoji, label, present=true) {
  if (!present) return `<div class="aspect-square rounded-lg border-2 border-dashed border-slate-200 grid place-items-center text-slate-400 text-xs">+ ${label}</div>`;
  return `<div class="aspect-square rounded-lg bg-slate-100 grid place-items-center">
    <div class="text-center">
      <div class="text-3xl">${emoji}</div>
      <div class="text-[10px] text-slate-500 mt-1">${label}</div>
    </div>
  </div>`;
}

/* ============================================================
   Render & wiring
   ============================================================ */
function applyI18n() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('bg-white', b.dataset.lang === state.lang);
    b.classList.toggle('shadow-sm', b.dataset.lang === state.lang);
  });
  document.querySelectorAll('.role-btn').forEach(b => {
    b.classList.toggle('bg-white', b.dataset.role === state.role);
    b.classList.toggle('shadow-sm', b.dataset.role === state.role);
  });
}

function render() {
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
  // Show nav section relevant to current role; keep all visible but highlight role
  document.getElementById('nav-operator').style.opacity = state.role==='operator' ? '1' : '.55';
  document.getElementById('nav-owner').style.opacity = state.role==='owner' ? '1' : '.55';
  document.getElementById('nav-admin').style.opacity = state.role==='admin' ? '1' : '.55';

  const fn = views[state.view] || views['op-dashboard'];
  document.getElementById('view-container').innerHTML = fn();
  applyI18n();
}

function setView(v) { state.view = v; render(); }
function setLang(l) { state.lang = l; localStorage.setItem('demoLang', l); render(); }
function setRole(r) {
  state.role = r;
  if (r === 'operator') state.view = 'op-dashboard';
  if (r === 'owner') state.view = 'own-listing';
  if (r === 'admin') state.view = 'adm-operators';
  showToast(t('toast.role') + ' ' + t('role.'+r));
  render();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('opacity-0');
  el.classList.add('opacity-100');
  setTimeout(() => { el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }, 2400);
}

function showModal(titleKey, bodyKey, onClose) {
  const m = document.getElementById('modal');
  document.getElementById('modal-content').innerHTML = `
    <h3 class="text-lg font-bold mb-2">${t(titleKey)}</h3>
    <p class="text-sm text-slate-600 mb-4">${t(bodyKey)}</p>
    <div class="text-right"><button id="modal-close" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-lg">${t('btn.close')}</button></div>
  `;
  m.classList.remove('hidden'); m.classList.add('flex');
  document.getElementById('modal-close').onclick = () => {
    m.classList.add('hidden'); m.classList.remove('flex');
    if (onClose) onClose();
  };
}

document.addEventListener('click', (e) => {
  const langBtn = e.target.closest('.lang-btn');
  if (langBtn) { setLang(langBtn.dataset.lang); return; }

  const roleBtn = e.target.closest('.role-btn');
  if (roleBtn) { setRole(roleBtn.dataset.role); return; }

  const navBtn = e.target.closest('.nav-item');
  if (navBtn && navBtn.dataset.view) { setView(navBtn.dataset.view); return; }

  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { setView(goBtn.dataset.go); return; }

  const action = e.target.closest('[data-action]');
  if (action) {
    const a = action.dataset.action;
    if (a === 'send-proposal') showModal('modal.proposal.title', 'modal.proposal.body', () => setView('op-units'));
    else if (a === 'approve-cost' || a === 'owner-approve') {
      showToast(t('toast.approved'));
      showModal('modal.approve.title', 'modal.approve.body', () => {
        if (state.role === 'owner') setView('own-listing'); else setView('op-service-requests');
      });
    }
    else if (a === 'send-block') { showToast(t('toast.blockSent')); setView('own-listing'); }
    else if (a === 'add-staff') showToast(t('toast.staffAdded'));
    else if (a === 'propose-price') showToast(t('toast.priceProposed'));
  }
});

/* boot */
render();
</script>
</body>
</html>
