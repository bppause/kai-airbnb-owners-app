<style>
  :root { color-scheme: light; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  .nav-item.active { background:#0f172a; color:#fff; }
  .pill { display:inline-flex; align-items:center; gap:.35rem; padding:.15rem .55rem; border-radius:9999px; font-size:.7rem; font-weight:600; }
  .pill-green { background:#dcfce7; color:#166534; }
  .pill-amber { background:#fef3c7; color:#92400e; }
  .pill-red { background:#fee2e2; color:#991b1b; }
  .pill-blue { background:#dbeafe; color:#1e40af; }
  .pill-gray { background:#e5e7eb; color:#374151; }
  .pill-violet { background:#ede9fe; color:#5b21b6; }
  .step-dot { width:1.5rem; height:1.5rem; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; }
  .fade-in { animation: fade .25s ease-out; }
  @keyframes fade { from { opacity:0; transform: translateY(4px);} to { opacity:1; transform:none;} }
  .demo-banner { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
  details>summary { cursor:pointer; list-style:none; }
  details>summary::-webkit-details-marker { display:none; }
  .clickable-hint { box-shadow: 0 0 0 0 rgba(99,102,241,.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(99,102,241,.5); }
    70% { box-shadow: 0 0 0 8px rgba(99,102,241,0); }
    100% { box-shadow: 0 0 0 0 rgba(99,102,241,0); }
  }
  @media (max-width: 767px) {
    aside#sidebar {
      position: fixed; top: 0; left: 0; bottom: 0; width: 17rem; z-index: 50;
      transform: translateX(-100%); transition: transform .25s ease-out;
      overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,.15);
    }
    aside#sidebar.open { transform: translateX(0); display: block !important; }
    body.drawer-open { overflow: hidden; }
  }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .table-scroll table { min-width: 560px; }
  .tab-strip { overflow-x: auto; -webkit-overflow-scrolling: touch; white-space: nowrap; scrollbar-width: none; }
  .tab-strip::-webkit-scrollbar { display: none; }
</style>

const state = {
  lang: localStorage.getItem('demoLang') || 'es',
  role: 'operator',
  view: 'op-dashboard',
  damagePathGuest: true,
  buildingNoticeRelayed: false,
};

const t = (k) => I18N[state.lang][k] ?? k;

function pill(textKey, kind) {
  return `<span class="pill pill-${kind}">${t(textKey)}</span>`;
}

/* ============================================================
   New helper functions
   ============================================================ */
function slaTimer(elapsed, remaining, overdue) {
  const color = overdue ? 'pill-red' : remaining && parseInt(remaining) <= 8 ? 'pill-amber' : 'pill-green';
  const txt = overdue ? `${elapsed} · ${state.lang==='es'?'vencido':'overdue'}` : `${elapsed} · ${remaining} ${state.lang==='es'?'restantes':'left'}`;
  return `<span class="pill ${color}">${txt}</span>`;
}

function inboxItem(emoji, title, sub, slaText, slaColor, ballInCourt, actionText, target) {
  const badge = ballInCourt
    ? `<span class="pill pill-amber">⚡ ${t('inbox.ballInCourt')}</span>`
    : `<span class="pill pill-blue">⏳ ${t('inbox.waiting')}</span>`;
  return `<div class="flex flex-wrap items-center justify-between gap-3 p-4 rounded-lg border border-slate-200 hover:border-indigo-300 hover:bg-indigo-50/30 bg-white">
    <div class="flex items-start gap-3 min-w-0 flex-1">
      <span class="text-2xl">${emoji}</span>
      <div class="min-w-0">
        <div class="font-medium text-sm">${title}</div>
        <div class="text-xs text-slate-500 mt-0.5">${sub}</div>
        <div class="flex flex-wrap gap-2 mt-1.5">
          <span class="pill ${slaColor}">${slaText}</span>
          ${badge}
        </div>
      </div>
    </div>
    ${actionText ? `<button data-go="${target}" class="shrink-0 bg-slate-900 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-slate-800">${actionText} →</button>` : ''}
  </div>`;
}

              <td class="px-4 py-3 text-xs">r.silva@andean.host<br/>+57 320 999 1100</td>

                <button class="text-xs bg-emerald-600 text-white px-2 py-1 rounded">${t('btn.approve')}</button>

/* ============================================================
   Small render helpers
   ============================================================ */
function kpi(icon, num, label, accent) {
  return `<div class="bg-white border border-slate-200 rounded-xl p-4">
    <div class="w-9 h-9 rounded-lg ${accent} grid place-items-center text-lg mb-2">${icon}</div>
    <div class="text-2xl font-bold leading-none">${num}</div>
    <div class="text-xs text-slate-500 mt-1">${label}</div>
  </div>`;
}
function attentionRow(emoji, ref, sub, title, kind, badgeKey, target, slaHtml) {
  return `<div data-go="${target}" class="cursor-pointer flex items-center justify-between gap-3 p-3 rounded-lg border border-slate-100 hover:border-indigo-300 hover:bg-indigo-50/40">
    <div class="flex items-center gap-3 min-w-0 flex-1">
      <span class="text-xl">${emoji}</span>
      <div class="min-w-0">
        <div class="font-medium text-sm truncate">${title}</div>
        <div class="text-xs text-slate-500 truncate">${ref} · ${sub}</div>
        ${slaHtml ? `<div class="mt-1">${slaHtml}</div>` : ''}
      </div>
    </div>
    ${pill(badgeKey, kind)}
  </div>`;
}
function communityBar(name, occupied, totalBars) {
  const dots = Array.from({length: totalBars}, (_,i) =>
    `<div class="h-2 rounded-sm ${i<occupied?'bg-indigo-500':'bg-slate-200'}"></div>`).join('');
  return `<div>
    <div class="flex justify-between text-xs mb-1"><span>${name}</span><span class="text-slate-400">${occupied} / ${totalBars}</span></div>
    <div class="grid grid-cols-8 gap-1">${dots}</div>
  </div>`;
}
function unitRow(apt, community, statusHtml, next, isHot=false) {
  return `<tr class="hover:bg-slate-50 cursor-pointer ${isHot?'bg-red-50/40':''}" data-go="op-unit-detail">
    <td class="px-4 py-3 font-medium">${apt}</td>
    <td class="px-4 py-3 text-slate-600">${community}</td>
    <td class="px-4 py-3">${statusHtml}</td>
    <td class="px-4 py-3 text-slate-600">${next}</td>
    <td class="px-4 py-3 text-right text-xs text-indigo-600">${state.lang==='es'?'Abrir':'Open'} →</td>
  </tr>`;
}
function srRow(id, title, unit, typeKey, urgKey, statusKey, cost, isHot=false) {
  const urgKind = urgKey==='urg.emergency' ? 'red' : urgKey==='urg.urgent' ? 'amber' : 'blue';
  const statKind = statusKey==='status.awaiting' ? 'amber' : statusKey==='status.inProgress' ? 'violet' : statusKey==='status.assigned' ? 'blue' : 'gray';
  return `<tr class="hover:bg-slate-50 cursor-pointer ${isHot?'bg-red-50/40':''}" data-go="op-service-detail">
    <td class="px-4 py-3"><div class="font-medium">${title}</div><div class="text-xs text-slate-500 font-mono">#${id}</div></td>
    <td class="px-4 py-3 text-slate-600">${unit}</td>
    <td class="px-4 py-3">${pill(typeKey,'gray')}</td>
    <td class="px-4 py-3">${pill(urgKey, urgKind)}</td>
    <td class="px-4 py-3">${pill(statusKey, statKind)}</td>
    <td class="px-4 py-3 text-right font-medium">${cost}</td>
  </tr>`;
}
function tl(num, color, text, when, done=false, current=false) {
  const colorMap = { green:'bg-emerald-500 text-white', amber:'bg-amber-500 text-white', gray:'bg-slate-200 text-slate-500' };
  return `<li class="relative">
    <span class="absolute -left-[31px] top-0 step-dot ${colorMap[color]} ${current?'clickable-hint':''}">${done?'✓':num}</span>
    <div class="font-medium ${color==='gray'?'text-slate-400':''}">${text}</div>
    <div class="text-xs text-slate-500">${when}</div>
  </li>`;
}
function attachThumb(emoji, label, present=true) {
  if (!present) return `<div class="aspect-square rounded-lg border-2 border-dashed border-slate-200 grid place-items-center text-slate-400 text-xs">+ ${label}</div>`;
  return `<div class="aspect-square rounded-lg bg-slate-100 grid place-items-center">
    <div class="text-center">
      <div class="text-3xl">${emoji}</div>
      <div class="text-[10px] text-slate-500 mt-1">${label}</div>
    </div>
  </div>`;
}
function priceLog(id, change, who, when) {
  return `<li class="relative">
    <span class="absolute -left-[31px] top-0 step-dot bg-slate-200 text-slate-700 text-[10px] font-mono">${id.slice(-2)}</span>
    <div class="font-medium">${change}</div>
    <div class="text-xs text-slate-500">${who} · ${when}</div>
  </li>`;
}
function staffRow(name, role, contact, units, statusHtml) {
  return `<tr class="hover:bg-slate-50">
    <td class="px-4 py-3 font-medium">${name}</td>
    <td class="px-4 py-3 text-slate-600">${role}</td>
    <td class="px-4 py-3 text-xs text-slate-600">${contact}</td>
    <td class="px-4 py-3">${units}</td>
    <td class="px-4 py-3">${statusHtml}</td>
  </tr>`;
}

/* ============================================================
   Render & wiring
   ============================================================ */
function applyI18n() {
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('bg-white', b.dataset.lang === state.lang);
    b.classList.toggle('shadow-sm', b.dataset.lang === state.lang);
  });
  document.querySelectorAll('.role-btn').forEach(b => {
    b.classList.toggle('bg-white', b.dataset.role === state.role);
    b.classList.toggle('shadow-sm', b.dataset.role === state.role);
  });
}

function render() {
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.view === state.view);
  });
  document.getElementById('nav-operator').style.opacity = state.role==='operator' ? '1' : '.55';
  document.getElementById('nav-owner').style.opacity = state.role==='owner' ? '1' : '.55';
  document.getElementById('nav-admin').style.opacity = state.role==='admin' ? '1' : '.55';

  const fn = views[state.view] || views['op-dashboard'];
  document.getElementById('view-container').innerHTML = fn();
  applyI18n();
}

function setView(v) { state.view = v; render(); closeDrawer(); }
function openDrawer() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('drawer-backdrop').classList.remove('hidden');
  document.body.classList.add('drawer-open');
}
function closeDrawer() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('drawer-backdrop').classList.add('hidden');
  document.body.classList.remove('drawer-open');
}
function setLang(l) { state.lang = l; localStorage.setItem('demoLang', l); render(); }
function setRole(r) {
  state.role = r;
  if (r === 'operator') state.view = 'op-dashboard';
  if (r === 'owner') state.view = 'own-inbox';
  if (r === 'admin') state.view = 'adm-operators';
  showToast(t('toast.role') + ' ' + t('role.'+r));
  render();
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.remove('opacity-0');
  el.classList.add('opacity-100');
  setTimeout(() => { el.classList.remove('opacity-100'); el.classList.add('opacity-0'); }, 2800);
}

function showModal(titleKey, bodyKey, onClose) {
  const m = document.getElementById('modal');
  document.getElementById('modal-content').innerHTML = `
    <h3 class="text-lg font-bold mb-2">${t(titleKey)}</h3>
    <p class="text-sm text-slate-600 mb-4">${t(bodyKey)}</p>
    <div class="text-right"><button id="modal-close" class="bg-slate-900 text-white text-sm px-4 py-2 rounded-lg">${t('btn.close')}</button></div>
  `;
  m.classList.remove('hidden'); m.classList.add('flex');
  document.getElementById('modal-close').onclick = () => {
    m.classList.add('hidden'); m.classList.remove('flex');
    if (onClose) onClose();
  };
}

document.addEventListener('click', (e) => {
  if (e.target.closest('#drawer-toggle')) { openDrawer(); return; }
  if (e.target.closest('#drawer-backdrop')) { closeDrawer(); return; }

  const langBtn = e.target.closest('.lang-btn');
  if (langBtn) { setLang(langBtn.dataset.lang); return; }

  const roleBtn = e.target.closest('.role-btn');
  if (roleBtn) { setRole(roleBtn.dataset.role); return; }

  const navBtn = e.target.closest('.nav-item');
  if (navBtn && navBtn.dataset.view) { setView(navBtn.dataset.view); return; }

  const goBtn = e.target.closest('[data-go]');
  if (goBtn) { setView(goBtn.dataset.go); return; }

  const action = e.target.closest('[data-action]');
  if (action) {
    const a = action.dataset.action;
    if (a === 'send-proposal') {
      showModal('modal.proposal.title', 'modal.proposal.body', () => setView('op-units'));
    } else if (a === 'approve-cost' || a === 'owner-approve') {
      showToast(t('toast.approved'));
      showModal('modal.approve.title', 'modal.approve.body', () => {
        if (state.role === 'owner') setView('own-inbox'); else setView('op-service-requests');
      });
    } else if (a === 'send-block') {
      showToast(t('toast.blockSent'));
      setView('own-inbox');
    } else if (a === 'add-staff') {
      showToast(t('toast.staffAdded'));
    } else if (a === 'propose-price') {
      showToast(t('toast.priceProposed'));
    } else if (a === 'approve-amendment' || a === 'propose-amendment') {
      showToast(t('toast.contractAmended'));
      showModal('modal.contract.title', 'modal.contract.body', null);
    } else if (a === 'submit-damage') {
      showToast(t('toast.damageReported'));
      showModal('modal.damage.title', 'modal.damage.body', () => setView('op-service-requests'));
    } else if (a === 'relay-notice') {
      showToast(t('toast.noticeRelayed'));
      state.buildingNoticeRelayed = true;
      render();
    } else if (a === 'dmg-guest') {
      state.damagePathGuest = true;
      render();
    } else if (a === 'dmg-nonguest') {
      state.damagePathGuest = false;
      render();
    } else if (a === 'owner-propose-price') {
      showToast(t('toast.pricingProposed'));
      setView('own-inbox');
    }
    return;
  }
});

/* boot */
render();
</script>
</body>
</html>
