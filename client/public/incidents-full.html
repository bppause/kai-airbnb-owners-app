<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI · Incidentes — Tour completo / Full tour</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#f7f3e9;
  --card:#fff;--border:rgba(47,79,58,.16);--yellow:#d9b45a;--red:#c62828;--blue:#1565c0;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1d22;color:var(--ink);overflow:hidden}
[data-lang-es],[data-lang-en]{display:none}
body.lang-es [data-lang-es]{display:inline}
body.lang-en [data-lang-en]{display:inline}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 30% 20%,rgba(11,127,140,.25),transparent 70%),radial-gradient(900px 500px at 80% 80%,rgba(198,40,40,.18),transparent 70%),#0f1d22}

.vbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.vbar-l{display:flex;align-items:center;gap:10px;color:#fff}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--green);font-size:1.05rem;position:relative}
.logo-mark .wave{font-size:.55rem;position:absolute;right:5px;top:5px;color:var(--teal)}
.vbar-l strong{display:block;font-size:.92rem;font-weight:800;letter-spacing:.01em}
.vsub{font-size:.74rem;opacity:.72}
.vbar-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang-btn{padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font-weight:700;font-size:.78rem;cursor:pointer;transition:.15s}
.lang-btn:hover{background:rgba(255,255,255,.08)}
.lang-btn.active{background:linear-gradient(135deg,#0b7f4f,#0b7f8c);border-color:transparent}
.vclose{width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;text-decoration:none;font-weight:300}
.vclose:hover{background:rgba(255,255,255,.16)}

.vstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 0;gap:14px;min-height:0}
.vframe{position:relative;width:min(820px,94vw);aspect-ratio:16/9;max-height:58vh;border-radius:18px;background:#f7f3e9;box-shadow:0 24px 80px rgba(0,0,0,.45),0 4px 0 rgba(255,255,255,.05) inset;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.scene{position:absolute;inset:0;opacity:0;transform:translateY(8px) scale(.98);transition:opacity .55s ease,transform .55s ease;padding:18px;display:flex;flex-direction:column;gap:10px}
.scene.show{opacity:1;transform:translateY(0) scale(1)}

.vcaption{width:min(820px,94vw);color:#eef6f9;text-align:center;padding:6px 12px}
.vstep{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:#aee2c5}
.vcaption h2{font-size:1.2rem;font-weight:800;margin-bottom:4px;color:#fff}
.vcaption p{font-size:.88rem;opacity:.85;max-width:680px;margin:0 auto;line-height:1.5}

.vctrls{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px 18px;background:transparent}
.vdots{display:flex;gap:6px;margin-right:10px;flex-wrap:wrap;max-width:60vw;justify-content:center}
.vdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.18s}
.vdot.done{background:rgba(255,255,255,.45)}
.vdot.cur{background:#5fd9a8;width:22px;border-radius:99px}
.vbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.vbtn:hover{background:rgba(255,255,255,.18)}
.vbtn.play{width:46px;height:46px;background:linear-gradient(135deg,#0b7f4f,#0b7f8c);border:none;font-size:1.1rem}
.vbtn.play:hover{filter:brightness(1.1)}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.06)}
.vprog-bar{height:100%;background:linear-gradient(90deg,#0b7f4f,#0b7f8c);width:0;transition:width .1s linear}

.m-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(32,46,38,.06)}
.m-row{display:flex;gap:10px;align-items:center}
.m-col{display:flex;flex-direction:column;gap:8px}
.m-title{font-size:.95rem;font-weight:900;color:#203f2b}
.m-sub{font-size:.74rem;color:var(--ink2)}
.m-pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#e8f5ec;color:var(--green);font-size:.7rem;font-weight:800;white-space:nowrap}
.m-pill.warn{background:#fff8e1;color:#7a5a00}
.m-pill.red{background:#fde8e8;color:var(--red)}
.m-pill.blue{background:#e3f2fd;color:var(--blue)}
.m-pill.gray{background:#eceff1;color:var(--ink2)}
.m-btn{padding:8px 14px;border-radius:10px;background:var(--grad);color:#fff;font-size:.78rem;font-weight:800;border:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(11,127,79,.25);text-decoration:none;cursor:pointer}
.m-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);box-shadow:none}
.m-btn.warn{background:linear-gradient(135deg,#d9b45a,#b08838);box-shadow:0 4px 12px rgba(217,180,90,.3)}
.m-btn.red{background:linear-gradient(135deg,#c62828,#9a1f1f);box-shadow:0 4px 12px rgba(198,40,40,.3)}
.m-input{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:.78rem;width:100%}
.m-banner{padding:10px 12px;border-radius:11px;background:linear-gradient(135deg,#fff8e1,#fffde7);border-left:4px solid var(--yellow);font-size:.78rem;color:#7a5a00;display:flex;gap:8px;align-items:center}
.m-banner.ok{background:#e8f5ec;color:#1b5634;border-left-color:var(--green)}
.m-banner.red{background:#fde8e8;color:#7a1818;border-left-color:var(--red)}
.m-banner.blue{background:#e3f2fd;color:#0d3c6e;border-left-color:var(--blue)}
.m-plate{display:inline-flex;align-items:center;justify-content:center;width:54px;height:34px;border-radius:7px;background:#17313a;color:#fff;font-weight:900;font-size:.82rem;letter-spacing:.04em}
.m-tab{padding:6px 12px;font-size:.74rem;font-weight:700;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer}
.m-tab.active{color:var(--green);border-bottom-color:var(--green)}
.m-modal{position:absolute;inset:14px;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(20,32,26,.18);padding:14px;display:flex;flex-direction:column;gap:9px;animation:popIn .4s ease;z-index:15;overflow:auto}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.m-modal h3{font-size:.95rem;color:#203f2b}
.m-photos{display:flex;gap:6px}
.m-photo{width:50px;height:50px;border-radius:7px;background:linear-gradient(135deg,#bcd4dc,#88abb6);position:relative;display:flex;align-items:center;justify-content:center;font-size:1rem;color:#fff}
.m-photo.add{background:#fff;border:2px dashed var(--border);color:var(--ink2);font-size:.7rem;font-weight:800}
.m-incident-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:11px;background:#fff}
.m-toggle-sw{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--ink);font-weight:700}
.m-toggle-sw .sw{width:32px;height:18px;border-radius:99px;background:var(--green);position:relative;transition:.2s}
.m-toggle-sw .sw::after{content:'';position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.m-toggle-sw.off .sw{background:#cfd8dc}
.m-toggle-sw.off .sw::after{right:auto;left:2px}
.m-timer{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#fff8e1;color:#7a5a00;font-size:.74rem;font-weight:800}
.m-bar{height:6px;border-radius:99px;background:#e8eef0;overflow:hidden}
.m-bar > div{height:100%;background:linear-gradient(90deg,#d9b45a,#c62828)}
.hl{position:relative}
.hl::after{content:'';position:absolute;inset:-4px;border:2px solid #5fd9a8;border-radius:14px;pointer-events:none;animation:pulseRing 1.6s ease-in-out infinite}
@keyframes pulseRing{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
.s-final{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;height:100%;text-align:center;padding:20px}
.s-final h2{font-size:1.5rem;color:#203f2b;font-weight:900}
.s-final p{font-size:.88rem;color:var(--ink2);max-width:520px}
.s-final .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lifecycle{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.lc-node{padding:6px 12px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:.74rem;font-weight:800;color:#203f2b;text-align:center;white-space:nowrap}
.lc-node.cur{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(11,127,79,.3)}
.lc-arr{color:var(--teal);font-size:.9rem}
.timeline{display:flex;flex-direction:column;gap:8px;position:relative;padding-left:18px}
.timeline::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border)}
.tl-row{position:relative;display:flex;gap:10px;align-items:flex-start}
.tl-row::before{content:'';position:absolute;left:-18px;top:5px;width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--green)}
.tl-row.warn::before{border-color:var(--yellow)}
.tl-row.blue::before{border-color:var(--blue)}
.tl-row.red::before{border-color:var(--red)}

@media(max-width:640px){
  .vstage{padding:10px 10px 0}
  .vframe{aspect-ratio:4/3;max-height:50vh}
  .vcaption h2{font-size:1.05rem}
  .vcaption p{font-size:.82rem}
  .vbtn{width:34px;height:34px}
  .vbtn.play{width:42px;height:42px}
  .scene{padding:12px}
  .vsub{display:none}
}
</style>
</head>
<body class="lang-es">
<div class="stage">
  <header class="vbar">
    <div class="vbar-l">
      <div class="logo-mark">K<span class="wave">~</span></div>
      <div>
        <strong>KAI · <span data-lang-es>Incidentes</span><span data-lang-en>Incidents</span></strong><br/>
        <span class="vsub" data-lang-es>Tour completo · 3 minutos</span><span class="vsub" data-lang-en>Full tour · 3 minutes</span>
      </div>
    </div>
    <div class="vbar-r">
      <button class="lang-btn active" data-set-lang="es">ES</button>
      <button class="lang-btn" data-set-lang="en">EN</button>
      <a href="/" class="vclose" title="Cerrar / Close">×</a>
    </div>
  </header>

  <main class="vstage">
    <div class="vframe" id="vframe"></div>
    <div class="vcaption">
      <div class="vstep" id="vstep">1 / 11</div>
      <h2 id="vtitle"></h2>
      <p id="vbody"></p>
    </div>
  </main>

  <footer class="vctrls">
    <div class="vdots" id="vdots"></div>
    <button class="vbtn" id="vprev" title="Anterior / Previous">‹</button>
    <button class="vbtn play" id="vplay" title="Pausar / Pause">⏸</button>
    <button class="vbtn" id="vnext" title="Siguiente / Next">›</button>
  </footer>

  <div class="vprog"><div class="vprog-bar" id="vprogbar"></div></div>
</div>

<script>
const SCENES = [
  {
    title: { es: 'Dónde viven tus incidentes', en: 'Where your incidents live' },
    body:  { es: 'El Dashboard te muestra una tarjeta roja "Requiere tu atención" si tienes incidentes pendientes. La pestaña Incidentes los lista todos. La sección Comunidad muestra los generales del edificio.',
             en: 'The Dashboard shows a red "Needs your attention" card if you have pending incidents. The Incidents tab lists them all. The Community section shows building-wide general incidents.' },
    duration: 13000,
    html: `
      <div>
        <div class="m-row" style="gap:8px;margin-bottom:10px"><div class="m-tab active">Dashboard</div><div class="m-tab"><span data-lang-es>Mis Unidades</span><span data-lang-en>My Units</span></div><div class="m-tab"><span data-lang-es>Incidentes</span><span data-lang-en>Incidents</span></div><div class="m-tab">📢 <span data-lang-es>Comunidad</span><span data-lang-en>Community</span></div></div>
        <div class="m-banner red hl" style="margin-bottom:10px"><span style="font-size:1.2rem">⚡</span><div><strong><span data-lang-es>Requiere tu atención</span><span data-lang-en>Needs your attention</span></strong> · <span data-lang-es>1 incidente necesita Paso 1 · 1 necesita Paso 2</span><span data-lang-en>1 incident needs Step 1 · 1 needs Step 2</span></div></div>
        <div class="m-row" style="gap:8px"><div class="m-card" style="flex:1;padding:10px"><div class="m-sub"><span data-lang-es>Unidades</span><span data-lang-en>Units</span></div><div class="m-title" style="font-size:1.4rem">2</div></div><div class="m-card" style="flex:1;padding:10px"><div class="m-sub"><span data-lang-es>Abiertos</span><span data-lang-en>Open</span></div><div class="m-title" style="font-size:1.4rem;color:var(--red)">2</div></div><div class="m-card" style="flex:1;padding:10px"><div class="m-sub"><span data-lang-es>Respuesta pendiente</span><span data-lang-en>Pending resolution</span></div><div class="m-title" style="font-size:1.4rem;color:#7a5a00">1</div></div><div class="m-card" style="flex:1;padding:10px"><div class="m-sub"><span data-lang-es>Cerrados</span><span data-lang-en>Closed</span></div><div class="m-title" style="font-size:1.4rem;color:var(--green)">12</div></div></div>
      </div>`
  },
  {
    title: { es: 'Reporta un incidente de unidad', en: 'Report a unit incident' },
    body:  { es: 'Toca "+ Reporte". Selecciona unidad, fecha, categoría (🚨 Serio · 👁 En observación · 📌 Menor) y tipo. Usa los ejemplos de la cuadrícula para pre-completar tipo y descripción.',
             en: 'Tap "+ Report". Select unit, date, category (🚨 Serious · 👁 Watch · 📌 Minor) and type. Use the example grid to pre-fill type and description.' },
    duration: 17000,
    html: `
      <div class="m-modal">
        <div style="display:flex;justify-content:space-between;align-items:center"><h3>+ <span data-lang-es>Reportar incidente</span><span data-lang-en>Report incident</span></h3><span style="color:var(--ink2);font-size:1.1rem">×</span></div>
        <div class="m-row" style="gap:8px"><div style="flex:1"><label class="m-sub" style="font-weight:700"><span data-lang-es>Unidad *</span><span data-lang-en>Unit *</span></label><div class="m-input">Torre A · 1102</div></div><div style="flex:1"><label class="m-sub" style="font-weight:700"><span data-lang-es>Fecha</span><span data-lang-en>Date</span></label><div class="m-input">2026-05-07</div></div><div style="flex:1"><label class="m-sub" style="font-weight:700"><span data-lang-es>Categoría</span><span data-lang-en>Category</span></label><div class="m-input hl">👁 <span data-lang-es>En observación</span><span data-lang-en>Under watch</span></div></div></div>
        <div><label class="m-sub" style="font-weight:700"><span data-lang-es>Ejemplos rápidos</span><span data-lang-en>Quick examples</span></label></div>
        <div class="m-row" style="gap:6px;flex-wrap:wrap"><span class="m-pill gray">🔧 <span data-lang-es>Mantenimiento</span><span data-lang-en>Maintenance</span></span><span class="m-pill gray">🔇 <span data-lang-es>Ruido</span><span data-lang-en>Noise</span></span><span class="m-pill gray">🚪 <span data-lang-es>Daño</span><span data-lang-en>Damage</span></span><span class="m-pill blue">😡 <span data-lang-es>Queja huésped</span><span data-lang-en>Guest complaint</span></span></div>
        <div><label class="m-sub" style="font-weight:700"><span data-lang-es>Descripción *</span><span data-lang-en>Description *</span></label><div class="m-input" style="height:42px;padding-top:7px"><span data-lang-es>Fuga en ducha del baño principal — requiere plomero antes del próximo check-in.</span><span data-lang-en>Leak in main bathroom shower — needs plumber before next check-in.</span></div></div>
      </div>`
  },
  {
    title: { es: 'Adjunta hasta 3 fotos', en: 'Attach up to 3 photos' },
    body:  { es: 'JPEG, PNG o WebP. El sistema comprime automáticamente cada foto a máx 1200px (calidad 0.72). Tócalas para verlas a tamaño completo, o ✕ para quitarlas. Las fotos quedan permanentemente con el incidente.',
             en: 'JPEG, PNG or WebP. The system auto-compresses each photo to max 1200px (quality 0.72). Tap to view full size, or ✕ to remove. Photos stay permanently with the incident.' },
    duration: 13000,
    html: `
      <div class="m-modal" style="justify-content:center">
        <h3>📷 <span data-lang-es>Fotos del incidente (máx 3)</span><span data-lang-en>Incident photos (max 3)</span></h3>
        <div class="m-photos hl" style="gap:10px;justify-content:center;margin:14px 0"><div class="m-photo" style="width:100px;height:100px;font-size:1.6rem">📷<span style="position:absolute;top:3px;right:3px;background:#fff;color:var(--ink);width:18px;height:18px;border-radius:50%;font-size:.8rem;display:flex;align-items:center;justify-content:center">×</span></div><div class="m-photo" style="width:100px;height:100px;font-size:1.6rem">📷<span style="position:absolute;top:3px;right:3px;background:#fff;color:var(--ink);width:18px;height:18px;border-radius:50%;font-size:.8rem;display:flex;align-items:center;justify-content:center">×</span></div><div class="m-photo add" style="width:100px;height:100px"><span data-lang-es>+ Agregar</span><span data-lang-en>+ Add</span></div></div>
        <div class="m-banner blue"><span>💡</span><span><span data-lang-es>Auto-compresión a 1200px · Borrador guardado automáticamente</span><span data-lang-en>Auto-compresses to 1200px · Draft saved automatically</span></span></div>
        <div class="m-row" style="justify-content:flex-end;gap:6px"><button class="m-btn ghost"><span data-lang-es>Cancelar</span><span data-lang-en>Cancel</span></button><button class="m-btn">📨 <span data-lang-es>Enviar</span><span data-lang-en>Submit</span></button></div>
      </div>`
  },
  {
    title: { es: 'Incidente general de la comunidad', en: 'General community incident' },
    body:  { es: 'Si el incidente afecta áreas comunes (lobby, parqueadero, piscina, fachada) y no una unidad específica, activa el interruptor "Incidente general". El campo de unidad desaparece y el incidente entra a la sección 📢 Comunidad para que el admin lo asigne o cierre.',
             en: 'If the incident affects common areas (lobby, parking, pool, facade) and not a specific unit, toggle "General community incident". The unit field disappears and the incident goes to the 📢 Community section for the admin to assign or close.' },
    duration: 16000,
    html: `
      <div class="m-modal">
        <h3>+ <span data-lang-es>Reportar incidente</span><span data-lang-en>Report incident</span></h3>
        <div class="m-banner blue hl"><span>📢</span><span><strong><span data-lang-es>Incidente general de la comunidad</span><span data-lang-en>General community incident</span></strong> <div class="m-toggle-sw" style="margin-left:auto;display:inline-flex"><span class="sw"></span><span><span data-lang-es>activado</span><span data-lang-en>on</span></span></div></span></div>
        <div class="m-sub"><span data-lang-es>El selector de unidad se oculta. Los administradores serán notificados.</span><span data-lang-en>Unit selector is hidden. Administrators will be notified.</span></div>
        <div class="m-row" style="gap:8px"><div style="flex:1"><label class="m-sub" style="font-weight:700"><span data-lang-es>Categoría</span><span data-lang-en>Category</span></label><div class="m-input">🚨 <span data-lang-es>Serio</span><span data-lang-en>Serious</span></div></div><div style="flex:1"><label class="m-sub" style="font-weight:700"><span data-lang-es>Tipo</span><span data-lang-en>Type</span></label><div class="m-input"><span data-lang-es>🚪 Vandalismo en lobby</span><span data-lang-en>🚪 Lobby vandalism</span></div></div></div>
        <div><label class="m-sub" style="font-weight:700"><span data-lang-es>Descripción</span><span data-lang-en>Description</span></label><div class="m-input" style="height:42px;padding-top:7px"><span data-lang-es>Pared del lobby con grafiti. Cámaras de seguridad capturaron el incidente a las 2am.</span><span data-lang-en>Lobby wall with graffiti. Security cameras captured the incident at 2am.</span></div></div>
        <div class="m-row" style="justify-content:flex-end"><button class="m-btn">📨 <span data-lang-es>Enviar a Comunidad</span><span data-lang-en>Submit to Community</span></button></div>
      </div>`
  },
  {
    title: { es: 'Ciclo de vida — 4 estados', en: 'Lifecycle — 4 states' },
    body:  { es: 'Cada incidente de unidad pasa por 4 estados. Los Pasos 1 y 2 son tuyos como propietario. El cierre lo hace el admin de comunidad. Los incidentes generales saltan los pasos: el admin asigna o cierra.',
             en: 'Every unit incident goes through 4 states. Steps 1 and 2 are yours as owner. Closing is done by the community admin. General incidents skip the owner steps: admin assigns or closes.' },

const frame = document.getElementById('vframe');
const stepEl = document.getElementById('vstep');
const titleEl = document.getElementById('vtitle');
const bodyEl = document.getElementById('vbody');
const dotsEl = document.getElementById('vdots');
const progBar = document.getElementById('vprogbar');
const playBtn = document.getElementById('vplay');
const prevBtn = document.getElementById('vprev');
const nextBtn = document.getElementById('vnext');

let cur = 0, playing = true, sceneStart = 0, raf = null;

function buildScenes(){
  SCENES.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'scene';
    el.innerHTML = s.html;
    frame.appendChild(el);
    const dot = document.createElement('div');
    dot.className = 'vdot';
    dot.addEventListener('click', ()=>go(i));
    dotsEl.appendChild(dot);
  });
}
function render(){
  document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('show', i===cur));
  document.querySelectorAll('.vdot').forEach((el,i)=>{
    el.classList.toggle('cur', i===cur);
    el.classList.toggle('done', i<cur);
  });
  stepEl.textContent = `${cur+1} / ${SCENES.length}`;
  const lang = document.body.classList.contains('lang-en') ? 'en' : 'es';
  titleEl.textContent = SCENES[cur].title[lang];
  bodyEl.textContent = SCENES[cur].body[lang];
}
function go(i){
  cur = (i+SCENES.length)%SCENES.length;
  sceneStart = performance.now();
  progBar.style.width = '0%';
  render();
}
function tick(now){
  if (!playing) { raf = requestAnimationFrame(tick); return; }
  const dur = SCENES[cur].duration;
  const elapsed = now - sceneStart;
  progBar.style.width = Math.min(100, (elapsed/dur)*100) + '%';
  if (elapsed >= dur) {
    if (cur === SCENES.length-1) { playing = false; playBtn.textContent = '↻'; }
    else go(cur+1);
  }
  raf = requestAnimationFrame(tick);
}
function togglePlay(){
  playing = !playing;
  if (!playing) { playBtn.textContent = '▶'; }
  else {
    if (cur === SCENES.length-1 && progBar.style.width === '100%') { go(0); }
    else { sceneStart = performance.now() - (parseFloat(progBar.style.width)/100)*SCENES[cur].duration; }
    playBtn.textContent = '⏸';
  }
}
playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', ()=>go(cur-1));
nextBtn.addEventListener('click', ()=>go(cur+1));
document.querySelectorAll('[data-set-lang]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const l = b.dataset.setLang;
    document.body.classList.toggle('lang-es', l==='es');
    document.body.classList.toggle('lang-en', l==='en');
    document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active', x.dataset.setLang===l));
    render();
  });
});
document.addEventListener('keydown', e=>{
  if (e.key === 'ArrowRight') go(cur+1);
  else if (e.key === 'ArrowLeft') go(cur-1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') location.href = '/';
});

const urlLang = new URLSearchParams(location.search).get('lang');
if (urlLang === 'en' || ((navigator.language||'').toLowerCase().startsWith('en') && urlLang!=='es')) {
  document.body.classList.remove('lang-es');
  document.body.classList.add('lang-en');
  document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active', x.dataset.setLang==='en'));
}

buildScenes();
go(0);
raf = requestAnimationFrame(tick);
</script>
