<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI Airbnb Owners · Tutorial completo / Full tutorial</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#0c1a23;
  --card:#fff;--border:rgba(255,255,255,.14);--yellow:#d9b45a;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#11364a,var(--bg) 60%);color:#f6fbf8;line-height:1.5;font-size:15px;overflow:hidden}

.stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
.player{width:min(1180px,100%);height:min(700px,calc(100vh - 170px));position:relative;border-radius:18px;background:#0a1620;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;display:flex;transition:width .25s ease,height .25s ease,border-radius .25s ease}
body.fullscreen .stage{padding:0;gap:0;height:100vh}
body.fullscreen .player{width:100vw;height:100vh;border-radius:0;max-width:none;max-height:none}
body.fullscreen .actions{display:none}

/* Side nav (chapters) */
.nav{width:240px;flex-shrink:0;background:rgba(255,255,255,.03);border-right:1px solid var(--border);overflow-y:auto;padding:60px 0 70px}
.nav h3{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:0 16px 6px;font-weight:800}
.chap{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;font-size:.78rem;color:#cfe6dc;transition:.15s}
.chap:hover{background:rgba(255,255,255,.05)}
.chap.active{background:linear-gradient(90deg,rgba(11,127,140,.25),transparent);border-left-color:#9ce5d6;color:#fff}
.chap-num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:900;flex-shrink:0;margin-top:2px}
.chap.active .chap-num{background:var(--grad);color:#fff}
.chap-text{display:flex;flex-direction:column;gap:1px;min-width:0}
.chap-text strong{font-size:.78rem;font-weight:800}
.chap-text span{font-size:.7rem;opacity:.65}

.right{flex:1;position:relative;min-width:0}
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.84rem;color:#eafff5}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.toplinks{margin-left:auto;display:flex;gap:6px;align-items:center}
.lang-btn,.speed{padding:4px 10px;border:1px solid var(--border);border-radius:99px;background:rgba(255,255,255,.06);color:#eafff5;cursor:pointer;font-size:.74rem;font-weight:700}
.lang-btn.active{background:var(--grad);border-color:transparent;color:#fff}

.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:54px 24px 78px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;text-align:center}
.slide.active{opacity:1;transform:none}
.slide .chip{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:rgba(11,127,140,.25);color:#9ce5d6;margin-bottom:8px;border:1px solid rgba(156,229,214,.25)}
.slide h2{font-size:clamp(1rem,2.1vw,1.4rem);font-weight:900;color:#fff;margin-bottom:4px;letter-spacing:-.01em}
.slide p.lede{font-size:clamp(.78rem,1.3vw,.92rem);color:#cfe6dc;max-width:780px;margin:0 auto 8px;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%;padding:0 12px}

/* Visual = scrollable screenshot viewport. Image renders at natural size
   so every pixel is legible; the viewport scrolls when the screenshot is
   larger than the frame. .frame is display:inline-block so it shrinkwraps
   to the image, keeping hotspot %s aligned with the image. */
.visual{flex:1;width:100%;max-width:940px;margin:6px auto 0;position:relative;display:flex;align-items:safe center;justify-content:safe center;min-height:0;overflow:auto;scrollbar-color:rgba(255,255,255,.35) rgba(255,255,255,.06);scrollbar-width:thin}
.visual::-webkit-scrollbar{width:10px;height:10px}
.visual::-webkit-scrollbar-track{background:rgba(255,255,255,.06);border-radius:5px}
.visual::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:5px}
.visual::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45)}
.visual .frame{position:relative;display:inline-block;flex-shrink:0;line-height:0;box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);border-radius:10px}
.visual img{display:block;width:auto;height:auto;max-width:none;max-height:none;border-radius:10px}

/* Hotspots overlaid on screenshots */
.hotspot{position:absolute;width:28px;height:28px;border-radius:50%;background:#d9b45a;border:2px solid #fff;cursor:pointer;transform:translate(-50%,-50%);z-index:3;color:#1a3c2a;font-weight:900;font-size:.84rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(217,180,90,.6),0 3px 8px rgba(0,0,0,.45);animation:hotpulse 1.8s infinite;padding:0;line-height:1}
.hotspot:hover{background:#e8c878;transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 0 rgba(217,180,90,0),0 6px 14px rgba(0,0,0,.55)}
.hotspot:focus{outline:3px solid #9ce5d6;outline-offset:3px}
@keyframes hotpulse{0%{box-shadow:0 0 0 0 rgba(217,180,90,.6),0 3px 8px rgba(0,0,0,.45)}70%{box-shadow:0 0 0 14px rgba(217,180,90,0),0 3px 8px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 0 rgba(217,180,90,0),0 3px 8px rgba(0,0,0,.45)}}
.hotspot .hot-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0a1620;color:#fff;font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;border:1px solid rgba(156,229,214,.3);box-shadow:0 4px 12px rgba(0,0,0,.5);max-width:240px;white-space:normal;text-align:center}
.hotspot .hot-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#0a1620}
.hotspot:hover .hot-tip,.hotspot:focus .hot-tip{opacity:1}

/* Hotspot popover */
.pop-backdrop{position:absolute;inset:0;background:rgba(8,16,22,.78);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;animation:popfade .18s ease}
.pop-backdrop[hidden]{display:none}
@keyframes popfade{from{opacity:0}to{opacity:1}}
.pop{background:#fff;color:var(--ink);border-radius:14px;padding:18px 20px 16px;max-width:460px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;animation:poprise .25s cubic-bezier(.2,.8,.3,1)}
@keyframes poprise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop h4{font-size:1rem;font-weight:900;color:#203f2b;margin:0 22px 6px 0;line-height:1.3}
.pop p{font-size:.86rem;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.pop .pop-mail{font-size:.78rem;background:#f0f8fb;border-left:3px solid #0b7f8c;padding:8px 10px;border-radius:6px;color:#0b7f8c;font-weight:700;margin-bottom:10px}
.pop .pop-tip{font-size:.78rem;background:#fff8e1;border-left:3px solid #d9b45a;padding:8px 10px;border-radius:6px;color:#7a5a00;font-weight:600;margin-bottom:10px}
.pop .pop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pop .pop-actions button{padding:7px 12px;border-radius:8px;font-weight:800;font-size:.78rem;background:linear-gradient(135deg,#0b7f4f,#0b7f8c);color:#fff;border:none;cursor:pointer;font-family:inherit}
.pop .pop-actions button.ghost{background:#eef6f4;color:#0b7f4f;border:1px solid rgba(11,127,79,.25)}
.pop-close{position:absolute;top:6px;right:8px;background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:#9aada8;line-height:1;padding:4px 8px}
.pop-close:hover{color:#235f72}

/* Caption */
.caption{position:absolute;left:0;right:0;bottom:60px;text-align:center;padding:0 24px;font-size:.82rem;color:#cfe6dc;opacity:.95}

/* Controls */
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);z-index:5}
.ctrl-btn{background:rgba(255,255,255,.1);border:1px solid var(--border);color:#eafff5;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:.92rem;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{background:rgba(255,255,255,.18)}
.ctrl-btn.primary{background:var(--grad);border-color:transparent;color:#fff;width:40px;height:40px;font-size:1rem}
.progress{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;position:relative;cursor:pointer}
.progress-fill{height:100%;background:linear-gradient(90deg,#0b7f4f,#9ce5d6);width:0%;transition:width .25s linear}
.timecode{font-size:.74rem;color:#cfe6dc;font-weight:700;min-width:74px;text-align:right;letter-spacing:.04em}

.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.act-btn{padding:10px 18px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#f6fbf8;cursor:pointer;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act-btn:hover{background:rgba(255,255,255,.12)}
.act-btn.primary{background:var(--grad);border-color:transparent}

.nav-toggle{display:none;position:absolute;top:8px;left:8px;z-index:6;background:rgba(255,255,255,.1);color:#eafff5;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer}

.es-text,.en-text{display:none}
body.lang-es .es-text{display:revert}
body.lang-en .en-text{display:revert}

@media (max-width:760px){
  .player{flex-direction:column;height:min(720px,calc(100vh - 200px))}
  .nav{position:absolute;inset:0;width:100%;z-index:7;display:none;padding-top:48px;background:#0a1620}
  .nav.open{display:block}
  .nav-toggle{display:inline-flex}
  .slide{padding:50px 12px 76px}
  .timecode{min-width:60px;font-size:.7rem}
  .caption{bottom:54px}
}
</style>
</head>

const SLIDES = [];
CHAPTERS.forEach((c,ci)=>c.slides.forEach((s,si)=>SLIDES.push({...s,ci,si,chap:c.title})));
let TOTAL = SLIDES.reduce((s,x)=>s+x.sec,0);

const slidesEl=document.getElementById('slides');
const chapEl  =document.getElementById('chapList');
const fill    =document.getElementById('fill');
const timeEl  =document.getElementById('time');
const capEl   =document.getElementById('caption');
const playBtn =document.getElementById('play');
const speedEl =document.getElementById('speed');
const bar     =document.getElementById('bar');

function hotsHtml(slideIdx, hotspots){
  if(!hotspots || !hotspots.length) return '';
  return hotspots.map((h,hi)=>{
    const tipEn=(h.title.en||'').replace(/"/g,'&quot;');
    return `<button class="hotspot" data-slide="${slideIdx}" data-hot="${hi}" style="left:${h.x}%;top:${h.y}%" aria-label="${tipEn}">${hi+1}<span class="hot-tip"><span class="es-text">Toca: ${h.title.es}</span><span class="en-text">Tap: ${h.title.en}</span></span></button>`;
  }).join('');
}

SLIDES.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='slide';
  d.innerHTML=`
    <span class="chip"><span class="es-text">${s.chap.es}</span><span class="en-text">${s.chap.en}</span></span>
    <h2><span class="es-text">${s.title.es}</span><span class="en-text">${s.title.en}</span></h2>
    <p class="lede"><span class="es-text">${s.text.es}</span><span class="en-text">${s.text.en}</span></p>
    <div class="visual"><div class="frame"><img src="${s.img}" alt=""/>${hotsHtml(i, s.hotspots)}</div></div>`;
  slidesEl.appendChild(d);
});

/* .frame is display:inline-block so it shrinkwraps to the image's natural
   size; .visual scrolls when the image is larger than the viewport. No
   sizing JS needed — hotspots positioned by % of .frame align with the
   image because frame == image. */
function fitAll(){ /* no-op kept for fullscreen handler */ }

CHAPTERS.forEach((c,ci)=>{
  const node=document.createElement('div');
  node.className='chap'; node.dataset.ci=ci;
  node.innerHTML=`<div class="chap-num">${ci+1}</div>
    <div class="chap-text"><strong><span class="es-text">${c.title.es}</span><span class="en-text">${c.title.en}</span></strong>
    <span><span class="es-text">${c.sub.es}</span><span class="en-text">${c.sub.en}</span></span></div>`;
  node.onclick=()=>jumpChapter(ci);
  chapEl.appendChild(node);
});

let idx=0, elapsed=0, playing=true, speed=1;

function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function startOf(i){let a=0;for(let k=0;k<i;k++)a+=SLIDES[k].sec;return a}
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.chap').forEach((el,i)=>el.classList.toggle('active',i===SLIDES[idx].ci));
  capEl.innerHTML=`<span class="es-text">${SLIDES[idx].cap.es}</span><span class="en-text">${SLIDES[idx].cap.en}</span>`;
  const hint=document.getElementById('hotHint');
  if(hint) hint.style.display=(SLIDES[idx].hotspots && SLIDES[idx].hotspots.length)?'inline-flex':'none';
  fill.style.width=Math.min(100,(elapsed/TOTAL)*100)+'%';
  timeEl.textContent=`${fmt(elapsed)} / ${fmt(TOTAL)}`;
  if(typeof narrateSlide === 'function') narrateSlide(SLIDES[idx], idx, false);
}
function tick(){
  if(!playing) return;
  elapsed += .25*speed;
  let acc=0,target=0;
  for(let i=0;i<SLIDES.length;i++){ if(elapsed < acc + SLIDES[i].sec){target=i;break} acc+=SLIDES[i].sec; if(i===SLIDES.length-1) target=i;}
  if(target!==idx){ idx=target; }
  if(elapsed>=TOTAL){ elapsed=TOTAL; playing=false; playBtn.textContent='↻'; }
  render();
}
function goto(i){
  idx=Math.max(0,Math.min(SLIDES.length-1,i));
  elapsed=startOf(idx); render();
}
function jumpChapter(ci){
  let target = SLIDES.findIndex(s=>s.ci===ci);
  if(target>=0){ playing=false; playBtn.textContent='▶'; goto(target); }
  document.getElementById('nav').classList.remove('open');
}
/* ─── Narration: MP3 if present, else browser TTS ────────────────────── */
const NAR = {
  audio: new Audio(),
  muted: (function(){ try { return localStorage.getItem('kai_tut_mute')==='1'; } catch(e){ return false; } })(),
  voicesByLang: {es:null, en:null}
};
NAR.audio.preload = 'auto';
const NARRATION_BASE = '/audio/full/';

function pickVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  if(!all.length) return;
  const score = v => (
    (/Google/i.test(v.name) ? 30 : 0) +
    (/Microsoft/i.test(v.name) ? 20 : 0) +
    (v.localService ? 5 : 0)
  );
  const pickFor = (langPrefix) => {
    const cands = all.filter(v => (v.lang||'').toLowerCase().startsWith(langPrefix));
    if(!cands.length) return null;
    cands.sort((a,b)=> score(b) - score(a));
    return cands[0];
  };
  NAR.voicesByLang.es = pickFor('es');
  NAR.voicesByLang.en = pickFor('en');
}
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged', pickVoices);
  pickVoices();
}

/* Audio is keyed by CHAPTER, not slide. The MP3 plays once when a chapter
   begins and continues across the slides within that chapter. When the
   user (or autoplay) crosses into a new chapter we load that chapter's
   audio. If a chapter has no MP3 we fall back to per-slide TTS reading
   each slide.text in turn. */
NAR.activeChapter = -1;
NAR.activeLang = null;
NAR.activeMode = null; // 'mp3' | 'tts' | null

function stopNarration(reset){
  try {
    if(reset !== false) NAR.audio.currentTime = 0;
    NAR.audio.pause();
  } catch(e){}
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
  if(reset !== false){
    NAR.activeChapter = -1;
    NAR.activeLang = null;
    NAR.activeMode = null;
  }
}

function speakText(text, langCode){
  if(!('speechSynthesis' in window) || !text) return;
  try { speechSynthesis.cancel(); } catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode==='en' ? 'en-US' : 'es-CO';
  if(NAR.voicesByLang[langCode]) u.voice = NAR.voicesByLang[langCode];
  u.rate = 1.02;
  speechSynthesis.speak(u);
}

function narrateSlide(slide, slideIdx, force){
  if(NAR.muted) { stopNarration(); return; }
  if(!playing && !force) { stopNarration(); return; }
  const ci = slide.ci;
  const lang = document.body.classList.contains('lang-en') ? 'en' : 'es';

  // Same chapter+lang already playing? Don't restart MP3; just keep going.
  if(!force && NAR.activeChapter === ci && NAR.activeLang === lang){
    if(NAR.activeMode === 'mp3' && !NAR.audio.ended){
      // Audio still rolling — leave it alone.
      return;
    }
    if(NAR.activeMode === 'tts'){
      // No MP3 for this chapter — narrate this slide's text individually.
      const txt = (slide.voice ? slide.voice[lang] : null) || (slide.text ? slide.text[lang] : '') || '';
      speakText(txt, lang);
      return;
    }
    // 'mp3' but already ended → fall through and silence the rest of the chapter.
    return;
  }

  // Crossing into a new chapter (or forced restart). Try MP3.
  stopNarration(true);
  NAR.activeChapter = ci;
  NAR.activeLang = lang;
  NAR.activeMode = null;
  const num = String(ci+1).padStart(2,'0');
  const url = NARRATION_BASE + num + '-' + lang + '.mp3';
  NAR.audio.src = url;

  const cleanup = () => {
    NAR.audio.removeEventListener('canplay', onCanPlay);
    NAR.audio.removeEventListener('error', onError);
    NAR.audio.removeEventListener('loadedmetadata', onMeta);
  };
  const onCanPlay = () => {
    cleanup();
    if(NAR.muted || (!playing && !force)) return;
    if(NAR.activeChapter !== ci || NAR.activeLang !== lang) return; // user moved on
    NAR.activeMode = 'mp3';
    NAR.audio.play().catch(()=>{
      NAR.activeMode = 'tts';
      const txt = (slide.voice ? slide.voice[lang] : null) || (slide.text ? slide.text[lang] : '') || '';
      speakText(txt, lang);
    });
  };
  const onError = () => {
    cleanup();
    if(NAR.activeChapter !== ci || NAR.activeLang !== lang) return;
    NAR.activeMode = 'tts';
    if(!NAR.muted && (playing || force)){
      const txt = (slide.voice ? slide.voice[lang] : null) || (slide.text ? slide.text[lang] : '') || '';
      speakText(txt, lang);
    }
  };
  // On metadata, stretch the LAST slide of this chapter to fit the audio so
  // chapter narration always finishes before crossing into the next chapter.
  const onMeta = () => {
    if(isFinite(NAR.audio.duration) && NAR.audio.duration > 0){
      const chapterSlides = SLIDES.filter(s => s.ci === ci);
      if(chapterSlides.length){
        const have = chapterSlides.reduce((s,x)=>s+x.sec,0);
        const needed = Math.ceil(NAR.audio.duration) + 1;
        if(needed > have){
          chapterSlides[chapterSlides.length - 1].sec += (needed - have);
          TOTAL = SLIDES.reduce((s,x)=>s+x.sec,0);
        }
      }
    }
  };
  NAR.audio.addEventListener('canplay', onCanPlay, { once:true });
  NAR.audio.addEventListener('error', onError, { once:true });
  NAR.audio.addEventListener('loadedmetadata', onMeta, { once:true });
  try { NAR.audio.load(); } catch(e){ onError(); }
}

function setMute(m){
  NAR.muted = !!m;
  try { localStorage.setItem('kai_tut_mute', NAR.muted ? '1' : '0'); } catch(e){}
  const btn = document.getElementById('muteBtn');
  if(btn) btn.textContent = NAR.muted ? '🔇' : '🔊';
  if(NAR.muted) stopNarration();
  else if(playing) narrateSlide(SLIDES[idx], idx, true);
}

function play(){
  if(elapsed>=TOTAL){ elapsed=0; idx=0; }
  playing=!playing;
  playBtn.textContent=playing?'⏸':'▶';
  if(playing){
    // Resume from paused position if still on the same chapter; else start fresh
    if(NAR.activeMode === 'mp3' && NAR.audio.paused && !NAR.audio.ended
        && NAR.activeChapter === SLIDES[idx].ci){
      NAR.audio.play().catch(()=>{});
    } else {
      narrateSlide(SLIDES[idx], idx, true);
    }
  } else {
    stopNarration(false); // pause without resetting position
  }
}
function cycleSpeed(){
  const order=[1,1.25,1.5,2,.75];
  speed=order[(order.indexOf(speed)+1)%order.length];
  speedEl.textContent=speed+'×';
}
function toggleFullscreen(){
  const on = document.body.classList.toggle('fullscreen');
  if(on && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else if(!on && document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  setTimeout(fitAll, 50);
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('fullscreen')){
    document.body.classList.remove('fullscreen');
  }
  setTimeout(fitAll, 50);
});

document.getElementById('play').onclick=play;
document.getElementById('next').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx+1);};
document.getElementById('prev').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx-1);};
bar.onclick=(e)=>{const r=bar.getBoundingClientRect();const pct=(e.clientX-r.left)/r.width;elapsed=Math.max(0,Math.min(TOTAL,pct*TOTAL));
  let acc=0;for(let i=0;i<SLIDES.length;i++){ if(elapsed<acc+SLIDES[i].sec){idx=i;break} acc+=SLIDES[i].sec; idx=i;}
  render();};

/* Hotspot popover */
const popBackdrop=document.getElementById('popBackdrop');
const popTitle=document.getElementById('popTitle');
const popBody=document.getElementById('popBody');
const popMail=document.getElementById('popMail');
const popTip=document.getElementById('popTip');
const popActions=document.getElementById('popActions');
let wasPlayingBeforePop=false;

function openPop(slideIdx, hotIdx){
  const h=SLIDES[slideIdx]?.hotspots?.[hotIdx];
  if(!h) return;
  popTitle.innerHTML=`<span class="es-text">${h.title.es}</span><span class="en-text">${h.title.en}</span>`;
  // Body: prefer custom body; fall back to tooltip body if tipkey present
  if(h.body){
    popBody.innerHTML=`<span class="es-text">${h.body.es}</span><span class="en-text">${h.body.en}</span>`;
  } else if(h.tipkey && TIP_TEXT[h.tipkey]){
    const t=TIP_TEXT[h.tipkey];
    popBody.innerHTML=`<span class="es-text">${t.body.es}</span><span class="en-text">${t.body.en}</span>`;
  } else {
    popBody.innerHTML='';
  }
  // Tooltip mirror box: if a tipkey is present AND we already used h.body, show the in-app tooltip text in a yellow box
  if(h.tipkey && TIP_TEXT[h.tipkey] && h.body){
    const t=TIP_TEXT[h.tipkey];
    popTip.hidden=false;
    popTip.innerHTML=`<strong><span class="es-text">ⓘ Tooltip en la app:</span><span class="en-text">ⓘ In-app tooltip:</span></strong> <span class="es-text">${t.body.es}</span><span class="en-text">${t.body.en}</span>`;
  } else if(h.tipkey && TIP_TEXT[h.tipkey] && !h.body){
    popTip.hidden=false;
    popTip.innerHTML=`<strong><span class="es-text">ⓘ Tooltip en la app</span><span class="en-text">ⓘ In-app tooltip</span></strong>`;
  } else {
    popTip.hidden=true; popTip.innerHTML='';
  }
  if(h.mail){ popMail.hidden=false; popMail.innerHTML=`<span class="es-text">${h.mail.es}</span><span class="en-text">${h.mail.en}</span>`; }
  else { popMail.hidden=true; popMail.innerHTML=''; }
  popActions.innerHTML='';
  (h.actions||[]).forEach(a=>{
    const btn=document.createElement('button');
    btn.innerHTML=`<span class="es-text">${a.label.es}</span><span class="en-text">${a.label.en}</span>`;
    btn.onclick=()=>{ closePop(); if(typeof a.chapter==='number') jumpChapter(a.chapter-1); };
    popActions.appendChild(btn);
  });
  const cont=document.createElement('button');
  cont.className='ghost';
  cont.innerHTML=`<span class="es-text">Continuar tutorial</span><span class="en-text">Continue tutorial</span>`;
  cont.onclick=()=>{
    closePop();
    if(wasPlayingBeforePop){
      playing=true; playBtn.textContent='⏸';
      if(NAR.activeMode === 'mp3' && NAR.audio.paused && !NAR.audio.ended
          && NAR.activeChapter === SLIDES[idx].ci){
        NAR.audio.play().catch(()=>{});
      } else {
        narrateSlide(SLIDES[idx], idx, true);
      }
    }
  };
  popActions.appendChild(cont);
  wasPlayingBeforePop=playing;
  playing=false; playBtn.textContent='▶';
  stopNarration(false); // pause; don't reset chapter position
  popBackdrop.hidden=false;
}
function closePop(){ popBackdrop.hidden=true; }
slidesEl.addEventListener('click',e=>{
  const btn=e.target.closest('.hotspot');
  if(!btn) return;
  e.stopPropagation();
  openPop(parseInt(btn.dataset.slide,10), parseInt(btn.dataset.hot,10));
});
document.addEventListener('keydown',e=>{
  if(!popBackdrop.hidden){ if(e.key==='Escape') closePop(); return; }
  if(e.key===' '){e.preventDefault();play();}
  else if(e.key==='ArrowRight') goto(idx+1);
  else if(e.key==='ArrowLeft') goto(idx-1);
});

function setLang(l){
  document.body.className=document.body.className.replace(/\blang-\w+\b/g,'').trim()+' lang-'+l;
  document.getElementById('btnEs').classList.toggle('active',l==='es');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.documentElement.lang=l==='en'?'en':'es';
  if(playing) narrateSlide(SLIDES[idx], idx, true);
}

const p=new URLSearchParams(location.search);
if(p.get('lang')==='en') setLang('en');
const startCh=parseInt(p.get('chapter'),10);
if(!isNaN(startCh) && startCh>=1 && startCh<=CHAPTERS.length){ jumpChapter(startCh-1); playing=true; playBtn.textContent='⏸'; }

/* Replace the static "KAI" title with the community the user has selected.
   ?community=<id> overrides; otherwise falls back to the localStorage value
   set by AuthGate. Fetches /api/communities/<id> for the bilingual name. */
(function brandFromCommunity(){
  let cid = p.get('community');
  if(!cid){ try { cid = localStorage.getItem('kai_community') || ''; } catch(e){} }
  if(!cid) return; // keep default "KAI"
  fetch('/api/communities/'+encodeURIComponent(cid)).then(r => r.ok ? r.json() : null).then(d => {
    if(!d) return;
    const nameEs = d.name || d.name_en || 'KAI';
    const nameEn = d.name_en || d.name || 'KAI';
    const txt = document.getElementById('brandText');
    if(txt){
      txt.replaceChildren();
      const es=document.createElement('span'); es.className='es-text'; es.textContent=nameEs+' · Tutorial completo';
      const en=document.createElement('span'); en.className='en-text'; en.textContent=nameEn+' · Full tutorial';
      txt.append(es,en);
    }
    // First letter as the brand mark
    const mark = document.getElementById('brandMark');
    if(mark){ mark.textContent = (nameEs.trim().charAt(0) || 'K').toUpperCase(); }
    // Doc title for the browser tab
    document.title = nameEs + ' · Tutorial completo / Full tutorial';
  }).catch(()=>{});
})();

playBtn.textContent='⏸';
const _mb = document.getElementById('muteBtn');
if(_mb) _mb.textContent = NAR.muted ? '🔇' : '🔊';
setInterval(tick,250);
render();
