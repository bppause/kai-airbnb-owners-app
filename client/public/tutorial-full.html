<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI Airbnb Owners · Tutorial completo / Full tutorial</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#0c1a23;
  --card:#fff;--border:rgba(255,255,255,.14);--yellow:#d9b45a;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#11364a,var(--bg) 60%);color:#f6fbf8;line-height:1.5;font-size:15px;overflow:hidden}

.stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
.player{width:min(1040px,100%);height:min(600px,calc(100vh - 170px));position:relative;border-radius:18px;background:#0a1620;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;display:flex;transition:width .25s ease,height .25s ease,border-radius .25s ease}
/* Fullscreen mode — player fills the viewport */
body.fullscreen .stage{padding:0;gap:0;height:100vh}
body.fullscreen .player{width:100vw;height:100vh;border-radius:0;max-width:none;max-height:none}
body.fullscreen .actions{display:none}
body.fullscreen .nav{width:280px}

/* Side nav (chapters) */
.nav{width:240px;flex-shrink:0;background:rgba(255,255,255,.03);border-right:1px solid var(--border);overflow-y:auto;padding:60px 0 70px}
.nav h3{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);padding:0 16px 6px;font-weight:800}
.chap{display:flex;align-items:flex-start;gap:8px;padding:8px 14px;cursor:pointer;border-left:3px solid transparent;font-size:.78rem;color:#cfe6dc;transition:.15s}
.chap:hover{background:rgba(255,255,255,.05)}
.chap.active{background:linear-gradient(90deg,rgba(11,127,140,.25),transparent);border-left-color:#9ce5d6;color:#fff}
.chap-num{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.66rem;font-weight:900;flex-shrink:0;margin-top:2px}
.chap.active .chap-num{background:var(--grad);color:#fff}
.chap-text{display:flex;flex-direction:column;gap:1px}
.chap-text strong{font-size:.78rem;font-weight:800}
.chap-text span{font-size:.7rem;opacity:.65}

/* Right side content */
.right{flex:1;position:relative;min-width:0}

/* Top bar */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.5),transparent);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.84rem;color:#eafff5}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.toplinks{margin-left:auto;display:flex;gap:6px;align-items:center}
.lang-btn{padding:4px 10px;border:1px solid var(--border);border-radius:99px;background:rgba(255,255,255,.06);color:#eafff5;cursor:pointer;font-size:.74rem;font-weight:700}
.lang-btn.active{background:var(--grad);border-color:transparent;color:#fff}
.speed{font-size:.72rem;color:#cfe6dc;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:99px;padding:3px 8px;cursor:pointer;font-weight:700}

/* Slide */
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:60px 32px 90px;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;text-align:center}
.slide.active{opacity:1;transform:none}
.slide .chip{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:rgba(11,127,140,.25);color:#9ce5d6;margin-bottom:12px;border:1px solid rgba(156,229,214,.25)}
.slide h2{font-size:clamp(1.1rem,2.4vw,1.6rem);font-weight:900;color:#fff;margin-bottom:6px;letter-spacing:-.01em}
.slide p.lede{font-size:clamp(.84rem,1.5vw,.98rem);color:#cfe6dc;max-width:640px;margin:0 auto 14px}
.slide .visual{width:min(640px,100%);margin:6px auto 0}
body.fullscreen .slide{padding:80px 40px 100px}
body.fullscreen .slide .visual{width:min(900px,100%)}
body.fullscreen .slide h2{font-size:clamp(1.4rem,2.4vw,2rem)}
body.fullscreen .slide p.lede{font-size:clamp(.95rem,1.4vw,1.05rem)}
.a-tip{cursor:pointer}
.a-tip:hover{background:#0b7f8c;color:#fff}

/* Mock UI */
.mock{background:#fff;color:var(--ink);border-radius:14px;padding:14px 16px;text-align:left;box-shadow:0 12px 28px rgba(0,0,0,.45);position:relative;overflow:hidden}
.mock-hdr{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:10px}
.mock-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.mock-hdr strong{font-size:.92rem;color:#203f2b}
.mock-row{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--ink2);padding:5px 0}
.mock-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:.82rem;border:none}
.mock-btn.ghost{background:#eef6f4;color:#0b7f4f;border:1px solid rgba(11,127,79,.25)}

/* ─── Production-accurate replicas (mirror App.jsx tokens) ───────────────── */
.a-card{background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(248,244,235,.98));border:1px solid rgba(47,79,58,.18);border-radius:18px;box-shadow:0 14px 40px rgba(32,46,38,.18);padding:18px 20px;color:#17313a;text-align:left;font-family:'DM Sans','Segoe UI',system-ui,sans-serif;position:relative;overflow:hidden}
.a-card.wide{padding:22px 24px}
.a-hdr{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
.a-title{font-family:'Playfair Display',Georgia,serif;color:#203f2b;font-size:1.15rem;margin:0 0 3px;font-weight:900;line-height:1.2}
.a-sub{color:#235f72;font-size:.78rem;margin:0;line-height:1.4}
.a-btn-p{background:linear-gradient(135deg,#0b7f4f,#0b7f8c);color:#fff;border:0;border-radius:14px;padding:9px 14px;font-weight:900;font-size:.82rem;box-shadow:0 8px 18px rgba(11,127,140,.22);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.a-btn-ghost{background:rgba(255,255,255,.86);color:#17313a;border:1px solid rgba(47,79,58,.18);border-radius:14px;padding:9px 14px;font-weight:800;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.a-btn-google{background:#fff;color:#17313a;border:1px solid rgba(47,79,58,.18);border-radius:14px;padding:11px 18px;font-weight:900;display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-family:inherit;box-shadow:0 8px 18px rgba(32,46,38,.1)}
.a-fg{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.a-fg-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.a-fg label{font-size:.74rem;font-weight:900;color:#203f2b;display:flex;align-items:center;gap:6px}
.a-fg input,.a-fg select,.a-fg textarea{width:100%;border:1px solid rgba(47,79,58,.24);border-radius:11px;background:rgba(255,255,255,.96);color:#102f3a;padding:9px 11px;font-size:.84rem;font-family:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.7)}
.a-fg input:read-only,.a-fg input.locked{background:#f0ece1;color:#7a8085;cursor:not-allowed}
.a-fg textarea{min-height:60px;resize:none;line-height:1.4}
.a-tip{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#e8f6f4;color:#0b7f8c;font-size:.66rem;font-weight:900;cursor:help;font-family:inherit;border:none}
.a-action-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#fff;border:1px solid rgba(47,79,58,.18);border-left:6px solid #d9b45a;border-radius:16px;padding:12px 14px;box-shadow:0 12px 28px rgba(32,46,38,.12);margin-bottom:8px}
.a-action-banner.resolve{border-left-color:#2f8f46}
.a-action-banner strong{display:block;color:#203f2b;font-size:.88rem;font-weight:900}
.a-action-banner small{display:block;color:#235f72;font-size:.76rem;margin-top:2px}
.a-list-card{background:#fff;border:1px solid rgba(47,79,58,.16);border-radius:16px;padding:12px 14px;box-shadow:0 8px 22px rgba(32,46,38,.08);display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.a-list-card .meta{flex:1;min-width:0}
.a-list-card .apt{font-family:'Playfair Display',Georgia,serif;font-weight:900;color:#203f2b;font-size:1rem;margin-bottom:2px}
.a-list-card .det{font-size:.76rem;color:#235f72;line-height:1.4}
.a-list-card .acts{display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.a-bsm{padding:6px 10px;border-radius:10px;font-weight:900;font-size:.74rem;border:1px solid rgba(47,79,58,.16);background:rgba(255,255,255,.84);color:#17313a;cursor:pointer;display:inline-flex;align-items:center;gap:4px;font-family:inherit}
.a-bsm.bs-rep{background:linear-gradient(135deg,#0b7f4f,#0b7f8c);color:#fff;border:0;box-shadow:0 6px 14px rgba(11,127,140,.22)}
.a-stat{background:rgba(255,255,255,.94);border:1px solid rgba(47,79,58,.16);border-radius:14px;padding:10px 12px;text-align:center;flex:1}
.a-stat .num{font-family:'Playfair Display',Georgia,serif;font-size:1.4rem;font-weight:900;color:#203f2b;line-height:1}
.a-stat .lbl{font-size:.7rem;color:#235f72;font-weight:800;margin-top:3px}
.a-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:#f0f8fb;color:#0b7f8c;border:1px solid #cce7ee;font-weight:800;font-size:.72rem}
.a-chip.warn{background:#fff8e1;color:#7a5a00;border-color:#f0d68a}
.a-chip.ok{background:#e8f5ec;color:#2F4F3A;border-color:#b9dec3}
.a-chip.danger{background:#fde8e4;color:#c62828;border-color:#f4b7b1}
.a-tower-locked{font-size:.7rem;color:#9aada8;margin-left:4px}
.a-section-label{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:#235f72;margin-bottom:6px}
.a-mission-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.a-mission-card{background:rgba(255,255,255,.7);border:1px solid rgba(90,105,80,.15);border-radius:12px;padding:10px;display:flex;gap:8px}
.a-mission-card .ico{font-size:1.2rem;line-height:1;flex-shrink:0}
.a-mission-card h5{font-size:.75rem;color:#2F4F3A;margin:0 0 2px;font-weight:900}
.a-mission-card p{font-size:.7rem;color:#3a6070;line-height:1.4;margin:0}
.a-email-list{display:flex;flex-direction:column;gap:6px}
.a-email-item{display:flex;gap:10px;padding:9px 10px;border-radius:10px;background:#fff;border:1px solid rgba(47,79,58,.12);align-items:flex-start}
.a-email-item.unread{background:#f5fbfc;border-color:#9ce5d6}
.a-email-item .ico{width:30px;height:30px;border-radius:9px;background:#e8f5ec;color:#2F4F3A;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.a-email-item strong{display:block;color:#203f2b;font-size:.82rem;font-weight:800;margin-bottom:1px}
.a-email-item span{font-size:.74rem;color:#235f72;line-height:1.4}
.a-flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;padding:8px;background:#f5fbfd;border-radius:10px;border:1px solid rgba(47,79,58,.1)}
.a-flow-node{padding:6px 10px;border-radius:8px;background:#fff;color:#203f2b;font-size:.74rem;font-weight:900;border:1px solid rgba(47,79,58,.16);text-align:center}
.a-flow-node.on{background:linear-gradient(135deg,#0b7f4f,#0b7f8c);color:#fff;border-color:transparent}
.a-flow-node.warn{background:#fff8e1;border-color:#d9b45a;color:#7a5a00}
.a-flow-arr{color:#0b7f8c;font-weight:900}
.cursor{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(217,180,90,.4);border:2px solid #d9b45a;pointer-events:none;transform:translate(-50%,-50%);box-shadow:0 0 0 4px rgba(217,180,90,.12);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,180,90,.5)}50%{box-shadow:0 0 0 10px rgba(217,180,90,0)}}
.email-card{display:flex;gap:10px;padding:10px;border-radius:10px;background:#f8fbf9;border:1px solid rgba(0,0,0,.06);font-size:.78rem;color:var(--ink2);align-items:flex-start}
.email-card .ico{width:34px;height:34px;border-radius:9px;background:#e8f5ec;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.email-card strong{display:block;color:#203f2b;font-size:.82rem;margin-bottom:2px}
.flow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.fnode{padding:6px 10px;border-radius:9px;background:#fff;color:#203f2b;font-size:.72rem;font-weight:800;border:1px solid rgba(0,0,0,.08)}
.fnode.on{background:var(--grad);color:#fff;border-color:transparent}
.farr{color:#9ce5d6;font-weight:900}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.tag{font-size:.7rem;padding:3px 9px;border-radius:99px;background:#f0f8fb;color:#0b7f8c;border:1px solid #cce7ee;font-weight:700}
.kbd{font-family:'SF Mono',Menlo,monospace;font-size:.72rem;background:#eef2f5;color:#203f2b;border:1px solid rgba(0,0,0,.1);border-bottom-width:2px;border-radius:5px;padding:1px 6px}

/* Hotspots — numbered button with hover tooltip */
.visual{position:relative}
.hotspot{position:absolute;width:28px;height:28px;border-radius:50%;background:#d9b45a;border:2px solid #fff;cursor:pointer;transform:translate(-50%,-50%);z-index:3;color:#1a3c2a;font-weight:900;font-size:.84rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(217,180,90,.6),0 3px 8px rgba(0,0,0,.35);animation:hotpulse 1.8s infinite;padding:0;line-height:1}
.hotspot:hover{background:#e8c878;transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 0 rgba(217,180,90,0),0 6px 14px rgba(0,0,0,.45)}
.hotspot:focus{outline:3px solid #9ce5d6;outline-offset:3px}
@keyframes hotpulse{0%{box-shadow:0 0 0 0 rgba(217,180,90,.6),0 3px 8px rgba(0,0,0,.35)}70%{box-shadow:0 0 0 14px rgba(217,180,90,0),0 3px 8px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 0 rgba(217,180,90,0),0 3px 8px rgba(0,0,0,.35)}}
/* Tooltip that appears on hover */
.hotspot .hot-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0a1620;color:#fff;font-size:.7rem;font-weight:700;padding:5px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;border:1px solid rgba(156,229,214,.3);box-shadow:0 4px 12px rgba(0,0,0,.5)}
.hotspot .hot-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#0a1620}
.hotspot:hover .hot-tip,.hotspot:focus .hot-tip{opacity:1}

/* Hotspot popover */
.pop-backdrop{position:absolute;inset:0;background:rgba(8,16,22,.72);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;animation:popfade .18s ease}
.pop-backdrop[hidden]{display:none}
@keyframes popfade{from{opacity:0}to{opacity:1}}
.pop{background:#fff;color:var(--ink);border-radius:14px;padding:18px 20px 16px;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5);position:relative;animation:poprise .25s cubic-bezier(.2,.8,.3,1)}
@keyframes poprise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop h4{font-size:1rem;font-weight:900;color:#203f2b;margin:0 22px 6px 0;line-height:1.3}
.pop p{font-size:.86rem;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.pop .pop-mail{font-size:.76rem;background:#f0f8fb;border-left:3px solid #0b7f8c;padding:8px 10px;border-radius:6px;color:#0b7f8c;font-weight:700;margin-bottom:10px;display:flex;align-items:flex-start;gap:6px}
.pop .pop-mail.empty{background:#f4f4f4;border-color:#bbb;color:#666}
.pop .pop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pop .pop-actions a,.pop .pop-actions button{padding:7px 12px;border-radius:8px;font-weight:800;font-size:.78rem;text-decoration:none;background:linear-gradient(135deg,#0b7f4f,#0b7f8c);color:#fff;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.pop .pop-actions a.ghost,.pop .pop-actions button.ghost{background:#eef6f4;color:#0b7f4f;border:1px solid rgba(11,127,79,.25)}
.pop-close{position:absolute;top:6px;right:8px;background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:#9aada8;line-height:1;padding:4px 8px}
.pop-close:hover{color:#235f72}

/* Email notification — compact chip row */
.mailbar{margin:8px auto 0;max-width:640px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.72rem;line-height:1.3;justify-content:center}
.mailbar .pill{display:inline-flex;align-items:center;gap:4px;padding:4px 9px;border-radius:99px;background:rgba(11,127,140,.22);color:#9ce5d6;border:1px solid rgba(156,229,214,.28);font-weight:700;white-space:nowrap}
.mailbar .pill.dest{background:#0f2a30;color:#fff;border-color:rgba(156,229,214,.45)}
.mailbar .pill.kind{background:rgba(255,255,255,.06);color:#cfe6dc;border-color:rgba(255,255,255,.14)}

/* Caption */
.caption{position:absolute;left:0;right:0;bottom:60px;text-align:center;padding:0 24px;font-size:.84rem;color:#cfe6dc;opacity:.95}

/* Controls */
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);z-index:5}
.ctrl-btn{background:rgba(255,255,255,.1);border:1px solid var(--border);color:#eafff5;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:.92rem;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{background:rgba(255,255,255,.18)}
.ctrl-btn.primary{background:var(--grad);border-color:transparent;color:#fff;width:40px;height:40px;font-size:1rem}
.progress{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;position:relative;cursor:pointer}
.progress-fill{height:100%;background:linear-gradient(90deg,#0b7f4f,#9ce5d6);width:0%;transition:width .25s linear}
.timecode{font-size:.74rem;color:#cfe6dc;font-weight:700;min-width:74px;text-align:right;letter-spacing:.04em}

/* Bottom action row */
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.act-btn{padding:10px 18px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#f6fbf8;cursor:pointer;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act-btn:hover{background:rgba(255,255,255,.12)}
.act-btn.primary{background:var(--grad);border-color:transparent}

/* Mobile chapter toggle */
.nav-toggle{display:none;position:absolute;top:8px;left:8px;z-index:6;background:rgba(255,255,255,.1);color:#eafff5;border:1px solid var(--border);padding:6px 10px;border-radius:8px;font-size:.74rem;font-weight:700;cursor:pointer}

/* Lang */
.es-text,.en-text{display:none}
body.lang-es .es-text{display:revert}
body.lang-en .en-text{display:revert}

@media (max-width:760px){
  .player{flex-direction:column;height:min(640px,calc(100vh - 200px))}
  .nav{position:absolute;inset:0;width:100%;z-index:7;display:none;padding-top:48px;background:#0a1620}
  .nav.open{display:block}
  .nav-toggle{display:inline-flex}
  .slide{padding:54px 18px 86px}
  .timecode{min-width:60px;font-size:.7rem}
  .caption{bottom:54px}
}
</style>
</head>
<body class="lang-es">

<div class="stage">

  <div class="player" id="player">

    <nav class="nav" id="nav">
      <h3><span class="es-text">Capítulos</span><span class="en-text">Chapters</span></h3>
      <div id="chapList"></div>
    </nav>

    <div class="right">
      <button class="nav-toggle" onclick="document.getElementById('nav').classList.toggle('open')">
        ☰ <span class="es-text">Capítulos</span><span class="en-text">Chapters</span>
      </button>

function mailHtml(em){
  if(!em) return '';
  const kinds=(em.kinds||[]).map(k=>`<span class="pill kind"><span class="es-text">${k.es}</span><span class="en-text">${k.en}</span></span>`).join('');
  return `<div class="mailbar">
    <span class="pill dest">📧 <span class="es-text">${em.dest.es}</span><span class="en-text">${em.dest.en}</span></span>
    ${kinds}
  </div>`;
}

function hotsHtml(slideIdx, hotspots){
  if(!hotspots || !hotspots.length) return '';
  return hotspots.map((h,hi)=>{
    const tipEn=(h.title.en||'').replace(/"/g,'&quot;');
    const pos = h.anchor ? '' : `left:${h.x}%;top:${h.y}%`;
    const dataAnchor = h.anchor ? ` data-anchor="${h.anchor}" data-at="${h.at||'tr'}"` : '';
    return `<button class="hotspot" data-slide="${slideIdx}" data-hot="${hi}"${dataAnchor} style="${pos}" aria-label="${tipEn}">${hi+1}<span class="hot-tip"><span class="es-text">Toca: ${h.title.es}</span><span class="en-text">Tap: ${h.title.en}</span></span></button>`;
  }).join('');
}

/* Position hotspots that have an anchor element. Called on slide activate
   and on resize/fullscreen. Computes pixel offsets from the named element
   and converts to a % within the .visual container so dots stay glued to
   their target even as layout reflows. */
function placeAnchoredHotspots(){
  const slide = document.querySelector('.slide.active');
  if(!slide) return;
  const visual = slide.querySelector('.visual');
  if(!visual) return;
  const v = visual.getBoundingClientRect();
  if(!v.width || !v.height) return;
  visual.querySelectorAll('.hotspot[data-anchor]').forEach(dot => {
    const target = visual.querySelector('[data-h="'+dot.dataset.anchor+'"]');
    if(!target) return;
    const t = target.getBoundingClientRect();
    const at = dot.dataset.at || 'tr';
    const inset = 6;
    let cx, cy;
    if(at==='tr'){ cx = t.right - inset; cy = t.top + inset; }
    else if(at==='tl'){ cx = t.left + inset; cy = t.top + inset; }
    else if(at==='br'){ cx = t.right - inset; cy = t.bottom - inset; }
    else if(at==='bl'){ cx = t.left + inset; cy = t.bottom - inset; }
    else if(at==='r' ){ cx = t.right - inset; cy = t.top + t.height/2; }
    else if(at==='l' ){ cx = t.left + inset; cy = t.top + t.height/2; }
    else if(at==='t' ){ cx = t.left + t.width/2; cy = t.top + inset; }
    else if(at==='b' ){ cx = t.left + t.width/2; cy = t.bottom - inset; }
    else { cx = t.left + t.width/2; cy = t.top + t.height/2; }
    dot.style.left = ((cx - v.left) / v.width * 100) + '%';
    dot.style.top  = ((cy - v.top)  / v.height * 100) + '%';
  });
}
window.addEventListener('resize', placeAnchoredHotspots);
document.addEventListener('fullscreenchange', ()=>setTimeout(placeAnchoredHotspots, 60));

function openTip(key){
  const t=TIP_TEXT[key];
  if(!t) return;
  popTitle.innerHTML=`<span class="es-text">${t.label.es}</span><span class="en-text">${t.label.en}</span>`;

}

/* Hotspot popover wiring */
const popBackdrop=document.getElementById('popBackdrop');
const popTitle=document.getElementById('popTitle');
const popBody=document.getElementById('popBody');
const popMail=document.getElementById('popMail');
const popActions=document.getElementById('popActions');
let wasPlayingBeforePop=false;

function openPop(slideIdx, hotIdx){
  const h=SLIDES[slideIdx]?.hotspots?.[hotIdx];
  if(!h) return;
  popTitle.innerHTML=`<span class="es-text">${h.title.es}</span><span class="en-text">${h.title.en}</span>`;
  popBody.innerHTML=`<span class="es-text">${h.body.es}</span><span class="en-text">${h.body.en}</span>`;
  if(h.mail){ popMail.hidden=false; popMail.innerHTML=`<span class="es-text">${h.mail.es}</span><span class="en-text">${h.mail.en}</span>`; }
  else { popMail.hidden=true; popMail.innerHTML=''; }
  popActions.innerHTML='';
  (h.actions||[]).forEach(a=>{
    const btn=document.createElement('button');
    btn.innerHTML=`<span class="es-text">${a.label.es}</span><span class="en-text">${a.label.en}</span>`;
    btn.onclick=()=>{ closePop(); if(typeof a.chapter==='number') jumpChapter(a.chapter-1); };
    popActions.appendChild(btn);
  });
  // Always include Continue
  const cont=document.createElement('button');
  cont.className='ghost';
  cont.innerHTML=`<span class="es-text">Continuar tutorial</span><span class="en-text">Continue tutorial</span>`;
  cont.onclick=()=>{ closePop(); if(wasPlayingBeforePop){ playing=true; playBtn.textContent='⏸'; } };
  popActions.appendChild(cont);
  wasPlayingBeforePop=playing;
  playing=false; playBtn.textContent='▶';
  popBackdrop.hidden=false;
}
function closePop(){
  popBackdrop.hidden=true;
}
slidesEl.addEventListener('click',e=>{
  const tip=e.target.closest('.a-tip[data-tipkey]');
  if(tip){ e.preventDefault(); e.stopPropagation(); openTip(tip.dataset.tipkey); return; }
  const btn=e.target.closest('.hotspot');
  if(!btn) return;
  e.stopPropagation();
  openPop(parseInt(btn.dataset.slide,10), parseInt(btn.dataset.hot,10));
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !popBackdrop.hidden) closePop(); });

CHAPTERS.forEach((c,ci)=>{
  const node=document.createElement('div');
  node.className='chap'; node.dataset.ci=ci;
  node.innerHTML=`<div class="chap-num">${ci+1}</div>
    <div class="chap-text"><strong><span class="es-text">${c.title.es}</span><span class="en-text">${c.title.en}</span></strong>
    <span><span class="es-text">${c.sub.es}</span><span class="en-text">${c.sub.en}</span></span></div>`;
  node.onclick=()=>jumpChapter(ci);
  chapEl.appendChild(node);
});

let idx=0, elapsed=0, playing=true, speed=1;

function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function startOf(i){let a=0;for(let k=0;k<i;k++)a+=SLIDES[k].sec;return a}
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.chap').forEach((el,i)=>el.classList.toggle('active',i===SLIDES[idx].ci));
  const s=SLIDES[idx];
  if(s.email){ capEl.innerHTML=''; capEl.style.display='none'; }
  else { capEl.style.display=''; capEl.innerHTML=`<span class="es-text">${s.cap.es}</span><span class="en-text">${s.cap.en}</span>`; }
  const hint=document.getElementById('hotHint');
  if(hint) hint.style.display=(s.hotspots && s.hotspots.length)?'inline-flex':'none';
  fill.style.width=Math.min(100,(elapsed/TOTAL)*100)+'%';
  timeEl.textContent=`${fmt(elapsed)} / ${fmt(TOTAL)}`;
  // Anchor-driven hotspots need a frame to reflow before measuring
  requestAnimationFrame(()=>requestAnimationFrame(placeAnchoredHotspots));
}
function tick(){
  if(!playing) return;
  elapsed += .25*speed;
  let acc=0,target=0;
  for(let i=0;i<SLIDES.length;i++){ if(elapsed < acc + SLIDES[i].sec){target=i;break} acc+=SLIDES[i].sec; if(i===SLIDES.length-1) target=i;}
  if(target!==idx){ idx=target; }
  if(elapsed>=TOTAL){ elapsed=TOTAL; playing=false; playBtn.textContent='↻'; }
  render();
}
function goto(i){
  idx=Math.max(0,Math.min(SLIDES.length-1,i));
  elapsed=startOf(idx); render();
}
function jumpChapter(ci){
  // first slide of chapter ci
  let target = SLIDES.findIndex(s=>s.ci===ci);
  if(target>=0){ playing=false; playBtn.textContent='▶'; goto(target); }
  document.getElementById('nav').classList.remove('open');
}
function play(){
  if(elapsed>=TOTAL){ elapsed=0; idx=0; }
  playing=!playing;
  playBtn.textContent=playing?'⏸':'▶';
}
function cycleSpeed(){
  const order=[1,1.25,1.5,2,.75];
  speed=order[(order.indexOf(speed)+1)%order.length];
  speedEl.textContent=speed+'×';
}
function toggleFullscreen(){
  const on = document.body.classList.toggle('fullscreen');
  document.getElementById('fsIcon').textContent = on ? '⛶ —' : '⛶';
  if(on && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else if(!on && document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('fullscreen')){
    document.body.classList.remove('fullscreen');
    document.getElementById('fsIcon').textContent='⛶';
  }
});
document.getElementById('play').onclick=play;
document.getElementById('next').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx+1);};
document.getElementById('prev').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx-1);};
bar.onclick=(e)=>{const r=bar.getBoundingClientRect();const pct=(e.clientX-r.left)/r.width;elapsed=Math.max(0,Math.min(TOTAL,pct*TOTAL));// snap idx
  let acc=0;for(let i=0;i<SLIDES.length;i++){ if(elapsed<acc+SLIDES[i].sec){idx=i;break} acc+=SLIDES[i].sec; idx=i;}
  render();};
document.addEventListener('keydown',e=>{
  if(!popBackdrop.hidden) return; // popover handles its own keys
  if(e.key===' '){e.preventDefault();play();}
  else if(e.key==='ArrowRight') goto(idx+1);
  else if(e.key==='ArrowLeft') goto(idx-1);
});

function setLang(l){
  document.body.className=document.body.className.replace(/\blang-\w+\b/g,'').trim()+' lang-'+l;
  document.getElementById('btnEs').classList.toggle('active',l==='es');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.documentElement.lang=l==='en'?'en':'es';
  // Swap text inside <option> elements (HTML doesn't allow nested spans there)
  const SEL_LABELS = {
    selType:{es:'🔊 Ruido excesivo',en:'🔊 Excessive noise'},
    selCat: {es:'⚠️ Incidente Grave',en:'⚠️ Serious incident'}
  };
  Object.keys(SEL_LABELS).forEach(id=>{
    const el=document.getElementById(id);
    if(el && el.options[0]) el.options[0].text = SEL_LABELS[id][l];
  });
}
const p=new URLSearchParams(location.search);
if(p.get('lang')==='en') setLang('en');
const startCh=parseInt(p.get('chapter'),10);
if(!isNaN(startCh) && startCh>=1 && startCh<=CHAPTERS.length){ jumpChapter(startCh-1); playing=true; playBtn.textContent='⏸'; }

playBtn.textContent='⏸';
setInterval(tick,250);
render();
