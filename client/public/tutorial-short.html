<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI Airbnb Owners · Tutorial corto / Short tutorial</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#0c1a23;
  --card:#fff;--border:rgba(255,255,255,.14);--yellow:#d9b45a;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#11364a,var(--bg) 60%);color:#f6fbf8;line-height:1.5;font-size:15px;overflow:hidden}

.stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
.player{width:min(1080px,100%);height:min(620px,calc(100vh - 170px));position:relative;border-radius:18px;background:#0a1620;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden;transition:width .25s ease,height .25s ease,border-radius .25s ease}
body.fullscreen .stage{padding:0;gap:0;height:100vh}
body.fullscreen .player{width:100vw;height:100vh;border-radius:0;max-width:none;max-height:none}
body.fullscreen .actions{display:none}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;color:#eafff5}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.toplinks{margin-left:auto;display:flex;gap:6px;align-items:center}
.lang-btn,.speed{padding:4px 10px;border:1px solid var(--border);border-radius:99px;background:rgba(255,255,255,.06);color:#eafff5;cursor:pointer;font-size:.74rem;font-weight:700}
.lang-btn.active{background:var(--grad);border-color:transparent;color:#fff}

.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;padding:46px 16px 56px;display:flex;flex-direction:column;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease;text-align:center}
.slide.active{opacity:1;transform:none}
.slide .chip{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:rgba(11,127,140,.25);color:#9ce5d6;margin-bottom:4px;border:1px solid rgba(156,229,214,.25)}
.slide h2{display:none}
.slide p.lede{display:none}

/* Visual = screenshot frame. Fills almost the entire slide so the
   screenshot is as large as possible while staying fully visible. */
.visual{flex:1;width:100%;max-width:none;margin:2px auto 0;position:relative;display:flex;align-items:center;justify-content:center;min-height:0}
.visual .frame{position:relative;display:block;line-height:0;box-shadow:0 16px 40px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.08);border-radius:10px}
.visual img{display:block;width:100%;height:100%;object-fit:contain;border-radius:10px}

.hotspot{position:absolute;width:28px;height:28px;border-radius:50%;background:#d9b45a;border:2px solid #fff;cursor:pointer;transform:translate(-50%,-50%);z-index:3;color:#1a3c2a;font-weight:900;font-size:.84rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 rgba(217,180,90,.6),0 3px 8px rgba(0,0,0,.45);animation:hotpulse 1.8s infinite;padding:0;line-height:1}
.hotspot:hover{background:#e8c878;transform:translate(-50%,-50%) scale(1.18);box-shadow:0 0 0 0 rgba(217,180,90,0),0 6px 14px rgba(0,0,0,.55)}
.hotspot:focus{outline:3px solid #9ce5d6;outline-offset:3px}
@keyframes hotpulse{0%{box-shadow:0 0 0 0 rgba(217,180,90,.6),0 3px 8px rgba(0,0,0,.45)}70%{box-shadow:0 0 0 14px rgba(217,180,90,0),0 3px 8px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 0 rgba(217,180,90,0),0 3px 8px rgba(0,0,0,.45)}}
.hotspot .hot-tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:#0a1620;color:#fff;font-size:.7rem;font-weight:700;padding:5px 9px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .15s;border:1px solid rgba(156,229,214,.3);box-shadow:0 4px 12px rgba(0,0,0,.5);max-width:240px;white-space:normal;text-align:center}
.hotspot .hot-tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#0a1620}
.hotspot:hover .hot-tip,.hotspot:focus .hot-tip{opacity:1}

.pop-backdrop{position:absolute;inset:0;background:rgba(8,16,22,.78);z-index:9;display:flex;align-items:center;justify-content:center;padding:24px;animation:popfade .18s ease}
.pop-backdrop[hidden]{display:none}
@keyframes popfade{from{opacity:0}to{opacity:1}}
.pop{background:#fff;color:var(--ink);border-radius:14px;padding:18px 20px 16px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.55);position:relative;animation:poprise .25s cubic-bezier(.2,.8,.3,1)}
@keyframes poprise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.pop h4{font-size:1rem;font-weight:900;color:#203f2b;margin:0 22px 6px 0;line-height:1.3}
.pop p{font-size:.86rem;color:var(--ink2);line-height:1.5;margin-bottom:10px}
.pop .pop-mail{font-size:.78rem;background:#f0f8fb;border-left:3px solid #0b7f8c;padding:8px 10px;border-radius:6px;color:#0b7f8c;font-weight:700;margin-bottom:10px}
.pop .pop-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pop .pop-actions button{padding:7px 12px;border-radius:8px;font-weight:800;font-size:.78rem;background:linear-gradient(135deg,#0b7f4f,#0b7f8c);color:#fff;border:none;cursor:pointer;font-family:inherit}
.pop .pop-actions button.ghost{background:#eef6f4;color:#0b7f4f;border:1px solid rgba(11,127,79,.25)}
.pop-close{position:absolute;top:6px;right:8px;background:transparent;border:none;font-size:1.3rem;cursor:pointer;color:#9aada8;line-height:1;padding:4px 8px}
.pop-close:hover{color:#235f72}

.caption{display:none}

.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(0deg,rgba(0,0,0,.78),transparent);z-index:5}
.ctrl-btn{background:rgba(255,255,255,.1);border:1px solid var(--border);color:#eafff5;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{background:rgba(255,255,255,.18)}
.ctrl-btn.primary{background:var(--grad);border-color:transparent;color:#fff;width:42px;height:42px;font-size:1.1rem}
.progress{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#0b7f4f,#9ce5d6);width:0%;transition:width .25s linear}
.timecode{font-size:.74rem;color:#cfe6dc;font-weight:700;min-width:64px;text-align:right;letter-spacing:.04em}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:.18s}
.dot.active{background:#9ce5d6;transform:scale(1.4)}

.actions{display:none}
.act-btn{padding:10px 18px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#f6fbf8;cursor:pointer;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act-btn:hover{background:rgba(255,255,255,.12)}
.act-btn.primary{background:var(--grad);border-color:transparent}

.es-text,.en-text{display:none}
body.lang-es .es-text{display:revert}
body.lang-en .en-text{display:revert}

@media (max-width:600px){
  .stage{padding:10px;gap:8px}
  .player{height:min(580px,calc(100vh - 200px))}
  .slide{padding:50px 12px 78px}
  .caption{bottom:54px;font-size:.78rem}
  .timecode{min-width:54px;font-size:.7rem}
}
</style>
</head>

        body:{es:"Si activas la casilla, el incidente NO va al Paso 1/Paso 2 del propietario. El admin lo asigna o cierra directamente.",

const slidesEl=document.getElementById('slides');
const dotsEl  =document.getElementById('dots');
const fill    =document.getElementById('fill');
const timeEl  =document.getElementById('time');
const capEl   =document.getElementById('caption');
const playBtn =document.getElementById('play');
let total = SLIDES.reduce((s,x)=>s+x.sec,0);

function hotsHtml(slideIdx, hotspots){
  if(!hotspots || !hotspots.length) return '';
  return hotspots.map((h,hi)=>{
    const tipEn=(h.title.en||'').replace(/"/g,'&quot;');
    return `<button class="hotspot" data-slide="${slideIdx}" data-hot="${hi}" style="left:${h.x}%;top:${h.y}%" aria-label="${tipEn}">${hi+1}<span class="hot-tip"><span class="es-text">Toca: ${h.title.es}</span><span class="en-text">Tap: ${h.title.en}</span></span></button>`;
  }).join('');
}

SLIDES.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='slide'; d.dataset.idx=i;
  d.innerHTML=`
    <span class="chip"><span class="es-text">${s.chip.es}</span><span class="en-text">${s.chip.en}</span></span>
    <h2><span class="es-text">${s.title.es}</span><span class="en-text">${s.title.en}</span></h2>
    <p class="lede"><span class="es-text">${s.text.es}</span><span class="en-text">${s.text.en}</span></p>
    <div class="visual"><div class="frame"><img src="${s.img}" alt=""/>${hotsHtml(i, s.hotspots)}</div></div>`;
  slidesEl.appendChild(d);
  const dot=document.createElement('div'); dot.className='dot'; dot.onclick=()=>goto(i); dotsEl.appendChild(dot);
});

/* Size each .frame to match the actual rendered image bounds inside its
   .visual container so hotspot %s align exactly. */
function fitFrame(slideEl){
  const visual=slideEl.querySelector('.visual');
  const frame =slideEl.querySelector('.frame');
  const img   =slideEl.querySelector('.frame img');
  if(!visual || !frame || !img) return;
  const apply=()=>{
    const cw=visual.clientWidth, ch=visual.clientHeight;
    const nw=img.naturalWidth, nh=img.naturalHeight;
    if(!cw || !ch || !nw || !nh) return;
    const cAR=cw/ch, iAR=nw/nh;
    let dw,dh;
    if(iAR>cAR){ dw=cw; dh=cw/iAR; } else { dh=ch; dw=ch*iAR; }
    frame.style.width =Math.round(dw)+'px';
    frame.style.height=Math.round(dh)+'px';
  };
  if(img.complete && img.naturalWidth) apply();
  else img.addEventListener('load', apply, { once:true });
  return apply;
}
const _fitters = Array.from(document.querySelectorAll('.slide')).map(fitFrame);
function fitAll(){ _fitters.forEach(fn => fn && fn()); }
window.addEventListener('resize', fitAll);
window.addEventListener('load', fitAll);

let idx=0, elapsed=0, playing=true;

function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===idx));
  const s=SLIDES[idx];
  capEl.innerHTML=`<span class="es-text">${s.cap.es}</span><span class="en-text">${s.cap.en}</span>`;
  const hint=document.getElementById('hotHint');
  if(hint) hint.style.display=(s.hotspots && s.hotspots.length)?'inline-flex':'none';
  fill.style.width=Math.min(100,(elapsed/total)*100)+'%';
  timeEl.textContent=`${fmt(elapsed)} / ${fmt(total)}`;
  if(typeof narrateSlide === 'function') narrateSlide(SLIDES[idx], idx, false);
}
function tick(){
  if(!playing) return;
  elapsed += .25;
  let acc=0, target=0;
  for(let i=0;i<SLIDES.length;i++){ if(elapsed < acc + SLIDES[i].sec){ target=i; break; } acc+=SLIDES[i].sec; if(i===SLIDES.length-1) target=i;}
  if(target!==idx){ idx=target; }
  if(elapsed >= total){ elapsed=total; playing=false; playBtn.textContent='↻'; }
  render();
}
function goto(i){
  idx=Math.max(0,Math.min(SLIDES.length-1,i));
  let acc=0; for(let k=0;k<idx;k++) acc+=SLIDES[k].sec;
  elapsed=acc; render();
}
/* ─── Narration: MP3 if present, else browser TTS ────────────────────── */
const NAR = {
  audio: new Audio(),
  muted: (function(){ try { return localStorage.getItem('kai_tut_mute')==='1'; } catch(e){ return false; } })(),
  voicesByLang: {es:null, en:null}
};
NAR.audio.preload = 'auto';
const NARRATION_BASE = '/audio/short/';

function pickVoices(){
  if(!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  if(!all.length) return;
  const score = v => (
    (/Google/i.test(v.name) ? 30 : 0) +
    (/Microsoft/i.test(v.name) ? 20 : 0) +
    (v.localService ? 5 : 0)
  );
  const pickFor = (langPrefix) => {
    const cands = all.filter(v => (v.lang||'').toLowerCase().startsWith(langPrefix));
    if(!cands.length) return null;
    cands.sort((a,b)=> score(b) - score(a));
    return cands[0];
  };
  NAR.voicesByLang.es = pickFor('es');
  NAR.voicesByLang.en = pickFor('en');
}
if('speechSynthesis' in window){
  speechSynthesis.addEventListener('voiceschanged', pickVoices);
  pickVoices();
}

function stopNarration(){
  try { NAR.audio.pause(); NAR.audio.currentTime = 0; } catch(e){}
  try { if('speechSynthesis' in window) speechSynthesis.cancel(); } catch(e){}
}

function speakText(text, langCode){
  if(!('speechSynthesis' in window) || !text) return;
  try { speechSynthesis.cancel(); } catch(e){}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = langCode==='en' ? 'en-US' : 'es-CO';
  if(NAR.voicesByLang[langCode]) u.voice = NAR.voicesByLang[langCode];
  u.rate = 1.02;
  speechSynthesis.speak(u);
}

let lastNarratedIdx = -1;
function narrateSlide(slide, slideIdx, force){
  if(NAR.muted) { stopNarration(); return; }
  if(!playing && !force) { stopNarration(); return; }
  if(!force && slideIdx === lastNarratedIdx) return;
  lastNarratedIdx = slideIdx;
  const lang = document.body.classList.contains('lang-en') ? 'en' : 'es';
  const num = String(slideIdx+1).padStart(2,'0');
  const url = NARRATION_BASE + num + '-' + lang + '.mp3';
  const text = (slide.voice ? slide.voice[lang] : null) || (slide.text ? slide.text[lang] : '') || '';
  stopNarration();
  NAR.audio.src = url;
  const onMeta = () => {
    NAR.audio.removeEventListener('loadedmetadata', onMeta);
    if(isFinite(NAR.audio.duration) && NAR.audio.duration > 0){
      const needed = Math.ceil(NAR.audio.duration) + 1;
      if(needed > slide.sec){
        slide.sec = needed;
        total = SLIDES.reduce((s,x)=>s+x.sec,0);
      }
    }
  };
  NAR.audio.addEventListener('loadedmetadata', onMeta, { once:true });
  const onCanPlay = () => {
    NAR.audio.removeEventListener('canplay', onCanPlay);
    NAR.audio.removeEventListener('error', onError);
    if(NAR.muted || (!playing && !force)) return;
    NAR.audio.play().catch(()=>{ speakText(text, lang); });
  };
  const onError = () => {
    NAR.audio.removeEventListener('canplay', onCanPlay);
    NAR.audio.removeEventListener('error', onError);
    if(!NAR.muted && (playing || force)) speakText(text, lang);
  };
  NAR.audio.addEventListener('canplay', onCanPlay, { once:true });
  NAR.audio.addEventListener('error', onError, { once:true });
  try { NAR.audio.load(); } catch(e){ onError(); }
}

function setMute(m){
  NAR.muted = !!m;
  try { localStorage.setItem('kai_tut_mute', NAR.muted ? '1' : '0'); } catch(e){}
  const btn = document.getElementById('muteBtn');
  if(btn) btn.textContent = NAR.muted ? '🔇' : '🔊';
  if(NAR.muted) stopNarration();
  else if(playing) narrateSlide(SLIDES[idx], idx, true);
}

function play(){
  if(elapsed>=total){ elapsed=0; idx=0; }
  playing=!playing;
  playBtn.textContent=playing?'⏸':'▶';
  if(playing) narrateSlide(SLIDES[idx], idx, true);
  else stopNarration();
}
document.getElementById('play').onclick=play;
document.getElementById('next').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx+1);};
document.getElementById('prev').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx-1);};

const popBackdrop=document.getElementById('popBackdrop');
const popTitle=document.getElementById('popTitle');
const popBody=document.getElementById('popBody');
const popMail=document.getElementById('popMail');
const popActions=document.getElementById('popActions');
let wasPlayingBeforePop=false;

function openPop(slideIdx, hotIdx){
  const h=SLIDES[slideIdx]?.hotspots?.[hotIdx];
  if(!h) return;
  popTitle.innerHTML=`<span class="es-text">${h.title.es}</span><span class="en-text">${h.title.en}</span>`;
  popBody.innerHTML=h.body ? `<span class="es-text">${h.body.es}</span><span class="en-text">${h.body.en}</span>` : '';
  if(h.mail){ popMail.hidden=false; popMail.innerHTML=`<span class="es-text">${h.mail.es}</span><span class="en-text">${h.mail.en}</span>`; }
  else { popMail.hidden=true; popMail.innerHTML=''; }
  popActions.innerHTML='';
  const cont=document.createElement('button');
  cont.className='ghost';
  cont.innerHTML=`<span class="es-text">Continuar tutorial</span><span class="en-text">Continue tutorial</span>`;
  cont.onclick=()=>{ closePop(); if(wasPlayingBeforePop){ playing=true; playBtn.textContent='⏸'; narrateSlide(SLIDES[idx], idx, true); } };
  popActions.appendChild(cont);
  wasPlayingBeforePop=playing;
  playing=false; playBtn.textContent='▶';
  stopNarration();
  popBackdrop.hidden=false;
}
function closePop(){ popBackdrop.hidden=true; }
slidesEl.addEventListener('click',e=>{
  const btn=e.target.closest('.hotspot');
  if(!btn) return;
  e.stopPropagation();
  openPop(parseInt(btn.dataset.slide,10), parseInt(btn.dataset.hot,10));
});

document.addEventListener('keydown',e=>{
  if(!popBackdrop.hidden){ if(e.key==='Escape') closePop(); return; }
  if(e.key===' '){e.preventDefault();play();}
  else if(e.key==='ArrowRight') goto(idx+1);
  else if(e.key==='ArrowLeft') goto(idx-1);
});

function setLang(l){
  document.body.className=document.body.className.replace(/\blang-\w+\b/g,'').trim()+' lang-'+l;
  document.getElementById('btnEs').classList.toggle('active',l==='es');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.documentElement.lang=l==='en'?'en':'es';
  if(playing) narrateSlide(SLIDES[idx], idx, true);
}
function toggleFullscreen(){
  const on = document.body.classList.toggle('fullscreen');
  if(on && document.documentElement.requestFullscreen){ document.documentElement.requestFullscreen().catch(()=>{}); }
  else if(!on && document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  setTimeout(fitAll, 50);
}
document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement && document.body.classList.contains('fullscreen')){
    document.body.classList.remove('fullscreen');
  }
  setTimeout(fitAll, 50);
});

const p=new URLSearchParams(location.search);
if(p.get('lang')==='en') setLang('en');

/* Replace the static "KAI" title with the community the user selected. */
(function brandFromCommunity(){
  let cid = p.get('community');
  if(!cid){ try { cid = localStorage.getItem('kai_community') || ''; } catch(e){} }
  if(!cid) return;
  fetch('/api/communities/'+encodeURIComponent(cid)).then(r => r.ok ? r.json() : null).then(d => {
    if(!d) return;
    const nameEs = d.name || d.name_en || 'KAI';
    const nameEn = d.name_en || d.name || 'KAI';
    const txt = document.getElementById('brandText');
    if(txt){
      txt.replaceChildren();
      const es=document.createElement('span'); es.className='es-text'; es.textContent=nameEs+' · Tutorial corto';
      const en=document.createElement('span'); en.className='en-text'; en.textContent=nameEn+' · Short tutorial';
      txt.append(es,en);
    }
    const mark = document.getElementById('brandMark');
    if(mark){ mark.textContent = (nameEs.trim().charAt(0) || 'K').toUpperCase(); }
    document.title = nameEs + ' · Tutorial corto / Short tutorial';
  }).catch(()=>{});
})();

playBtn.textContent='⏸';
const _mb = document.getElementById('muteBtn');
if(_mb) _mb.textContent = NAR.muted ? '🔇' : '🔊';
setInterval(tick,250);
render();
</script>
