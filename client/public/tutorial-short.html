<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI Airbnb Owners · Tutorial corto / Short tutorial</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#0c1a23;
  --card:#fff;--border:rgba(255,255,255,.14);--yellow:#d9b45a;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:radial-gradient(circle at 20% 0%,#11364a,var(--bg) 60%);color:#f6fbf8;line-height:1.5;font-size:15px;overflow:hidden}

/* ─── Stage / video frame ─── */
.stage{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:14px}
.player{width:min(960px,100%);height:min(540px,calc(100vh - 170px));position:relative;border-radius:18px;background:#0a1620;box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}

/* Top bar */
.topbar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.86rem;color:#eafff5}
.brand-mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.toplinks{margin-left:auto;display:flex;gap:6px}
.lang-btn{padding:4px 10px;border:1px solid var(--border);border-radius:99px;background:rgba(255,255,255,.06);color:#eafff5;cursor:pointer;font-size:.74rem;font-weight:700}
.lang-btn.active{background:var(--grad);border-color:transparent;color:#fff}

/* Slide area */
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px 90px;opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease;text-align:center}
.slide.active{opacity:1;transform:none}
.slide h2{font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:900;color:#fff;margin-bottom:8px;letter-spacing:-.01em}
.slide p{font-size:clamp(.85rem,1.6vw,1rem);color:#cfe6dc;max-width:640px;margin:0 auto}
.slide .chip{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:99px;background:rgba(11,127,140,.25);color:#9ce5d6;margin-bottom:14px;border:1px solid rgba(156,229,214,.25)}
.slide .visual{margin:18px 0 10px;width:min(620px,100%)}

/* Mock UI elements (the "video" content) */
.mock{background:#fff;color:var(--ink);border-radius:14px;padding:14px 16px;text-align:left;box-shadow:0 12px 28px rgba(0,0,0,.45);position:relative;overflow:hidden}
.mock-hdr{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid rgba(0,0,0,.08);margin-bottom:10px}
.mock-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);color:var(--green);display:flex;align-items:center;justify-content:center;font-weight:900}
.mock-hdr strong{font-size:.92rem;color:#203f2b}
.mock-row{display:flex;gap:8px;align-items:center;font-size:.82rem;color:var(--ink2);padding:6px 0}
.mock-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--grad);color:#fff;font-weight:800;font-size:.82rem;border:none}
.mock-btn.ghost{background:#eef6f4;color:#0b7f4f;border:1px solid rgba(11,127,79,.25)}
.cursor{position:absolute;width:18px;height:18px;border-radius:50%;background:rgba(217,180,90,.4);border:2px solid #d9b45a;pointer-events:none;transform:translate(-50%,-50%);transition:left .9s cubic-bezier(.5,.1,.2,1),top .9s cubic-bezier(.5,.1,.2,1);box-shadow:0 0 0 4px rgba(217,180,90,.12)}
.email-card{display:flex;gap:10px;padding:10px;border-radius:10px;background:#f8fbf9;border:1px solid rgba(0,0,0,.06);font-size:.78rem;color:var(--ink2);align-items:flex-start}
.email-card .ico{width:34px;height:34px;border-radius:9px;background:#e8f5ec;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.email-card strong{display:block;color:#203f2b;font-size:.84rem;margin-bottom:2px}
.flow{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.fnode{padding:7px 11px;border-radius:9px;background:#fff;color:#203f2b;font-size:.76rem;font-weight:800;border:1px solid rgba(0,0,0,.08)}
.fnode.on{background:var(--grad);color:#fff;border-color:transparent}
.farr{color:#9ce5d6;font-weight:900}

/* Email notification banner shown under the visual */
.mailbar{margin-top:10px;padding:10px 12px;border-radius:10px;background:#0f2a30;border:1px solid rgba(156,229,214,.25);text-align:left;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;max-width:620px;margin-left:auto;margin-right:auto}
.mailbar .ico{width:34px;height:34px;border-radius:9px;background:rgba(11,127,140,.25);display:flex;align-items:center;justify-content:center;font-size:1rem}
.mailbar strong{display:block;font-size:.8rem;color:#9ce5d6;font-weight:800;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.mailbar .row{font-size:.78rem;color:#cfe6dc;line-height:1.45}
.mailbar .row b{color:#fff;font-weight:800}
.mailbar .row.kind{color:#fff;font-weight:700}
.mailbar.none{background:rgba(255,255,255,.04);border-style:dashed;color:#cfe6dc}
.mailbar.none .ico{background:rgba(255,255,255,.08)}

/* Caption ribbon */
.caption{position:absolute;left:0;right:0;bottom:60px;text-align:center;padding:0 24px;font-size:.84rem;color:#cfe6dc;opacity:.95}

/* Controls / progress */
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);z-index:5}
.ctrl-btn{background:rgba(255,255,255,.1);border:1px solid var(--border);color:#eafff5;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.95rem;display:flex;align-items:center;justify-content:center}
.ctrl-btn:hover{background:rgba(255,255,255,.18)}
.ctrl-btn.primary{background:var(--grad);border-color:transparent;color:#fff;width:42px;height:42px;font-size:1.1rem}
.progress{flex:1;height:5px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,#0b7f4f,#9ce5d6);width:0%;transition:width .25s linear}
.timecode{font-size:.74rem;color:#cfe6dc;font-weight:700;min-width:64px;text-align:right;letter-spacing:.04em}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;transition:.18s}
.dot.active{background:#9ce5d6;transform:scale(1.4)}

/* Bottom action row (under player) */
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.act-btn{padding:10px 18px;border-radius:11px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#f6fbf8;cursor:pointer;font-size:.84rem;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.act-btn:hover{background:rgba(255,255,255,.12)}
.act-btn.primary{background:var(--grad);border-color:transparent}

/* Language visibility */
.es-text,.en-text{display:none}
body.lang-es .es-text{display:revert}
body.lang-en .en-text{display:revert}

@media (max-width:600px){
  .stage{padding:10px;gap:8px}
  .player{height:min(560px,calc(100vh - 200px))}
  .slide{padding:56px 18px 84px}
  .caption{bottom:54px;font-size:.78rem}
  .timecode{min-width:54px;font-size:.7rem}
}
</style>
</head>

/* ─── Player engine ─── */
const slidesEl=document.getElementById('slides');
const dotsEl  =document.getElementById('dots');
const fill    =document.getElementById('fill');
const timeEl  =document.getElementById('time');
const capEl   =document.getElementById('caption');
const playBtn =document.getElementById('play');
const lang    =()=>document.body.classList.contains('lang-en')?'en':'es';
const total   =SLIDES.reduce((s,x)=>s+x.sec,0);

function mailHtml(em){
  if(!em) return '';
  if(em.none){
    return `<div class="mailbar none"><div class="ico">🚫</div><div>
      <strong><span class="es-text">No envía email</span><span class="en-text">No email sent</span></strong>
      <div class="row"><span class="es-text">${em.to.es}</span><span class="en-text">${em.to.en}</span></div>
    </div></div>`;
  }
  const kinds=(em.kinds||[]).map(k=>`<div class="row kind">• <span class="es-text">${k.es}</span><span class="en-text">${k.en}</span></div>`).join('');
  return `<div class="mailbar"><div class="ico">📧</div><div>
    <strong><span class="es-text">Notificación por email</span><span class="en-text">Email notification</span></strong>
    <div class="row"><b><span class="es-text">Llega a:</span><span class="en-text">Sent to:</span></b> <span class="es-text">${em.to.es}</span><span class="en-text">${em.to.en}</span></div>
    ${kinds}
  </div></div>`;
}

SLIDES.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='slide'; d.dataset.idx=i;
  d.innerHTML=`
    <span class="chip"><span class="es-text">${s.chip.es}</span><span class="en-text">${s.chip.en}</span></span>
    <h2><span class="es-text">${s.title.es}</span><span class="en-text">${s.title.en}</span></h2>
    <p><span class="es-text">${s.text.es}</span><span class="en-text">${s.text.en}</span></p>
    <div class="visual">${s.visual}</div>
    ${mailHtml(s.email)}`;
  slidesEl.appendChild(d);
  const dot=document.createElement('div'); dot.className='dot'; dot.onclick=()=>goto(i); dotsEl.appendChild(dot);
});

let idx=0, elapsed=0, playing=true, timer=null;

function fmt(sec){const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${m}:${String(s).padStart(2,'0')}`}
function render(){
  document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===idx));
  document.querySelectorAll('.dot').forEach((el,i)=>el.classList.toggle('active',i===idx));
  capEl.innerHTML=`<span class="es-text">${SLIDES[idx].cap.es}</span><span class="en-text">${SLIDES[idx].cap.en}</span>`;
  fill.style.width=Math.min(100,(elapsed/total)*100)+'%';
  timeEl.textContent=`${fmt(elapsed)} / ${fmt(total)}`;
}
function tick(){
  if(!playing) return;
  elapsed += .25;
  // figure out which slide we're on based on cumulative seconds
  let acc=0, target=0;
  for(let i=0;i<SLIDES.length;i++){ if(elapsed < acc + SLIDES[i].sec){ target=i; break; } acc+=SLIDES[i].sec; if(i===SLIDES.length-1) target=i;}
  if(target!==idx){ idx=target; }
  if(elapsed >= total){ elapsed=total; playing=false; playBtn.textContent='↻'; }
  render();
}
function goto(i){
  idx=Math.max(0,Math.min(SLIDES.length-1,i));
  let acc=0; for(let k=0;k<idx;k++) acc+=SLIDES[k].sec;
  elapsed=acc; render();
}
function play(){
  if(elapsed>=total){ elapsed=0; idx=0; }
  playing=!playing;
  playBtn.textContent=playing?'⏸':'▶';
}
document.getElementById('play').onclick=play;
document.getElementById('next').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx+1);};
document.getElementById('prev').onclick=()=>{playing=false;playBtn.textContent='▶';goto(idx-1);};
document.addEventListener('keydown',e=>{
  if(e.key===' '){e.preventDefault();play();}
  else if(e.key==='ArrowRight') goto(idx+1);
  else if(e.key==='ArrowLeft') goto(idx-1);
});

function setLang(l){
  document.body.className='lang-'+l;
  document.getElementById('btnEs').classList.toggle('active',l==='es');
  document.getElementById('btnEn').classList.toggle('active',l==='en');
  document.documentElement.lang=l==='en'?'en':'es';
}
const p=new URLSearchParams(location.search);
if(p.get('lang')==='en') setLang('en');

playBtn.textContent='⏸';
timer=setInterval(tick,250);
render();
</script>
</body>
</html>
