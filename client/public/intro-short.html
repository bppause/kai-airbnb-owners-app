<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI Airbnb Owners · Tour rápido / Quick tour</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#f7f3e9;
  --card:#fff;--border:rgba(47,79,58,.16);--yellow:#d9b45a;--red:#c62828;--blue:#1565c0;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1d22;color:var(--ink);overflow:hidden}
[data-lang-es],[data-lang-en]{display:none}
body.lang-es [data-lang-es]{display:inline}
body.lang-en [data-lang-en]{display:inline}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 30% 20%,rgba(11,127,140,.25),transparent 70%),radial-gradient(900px 500px at 80% 80%,rgba(11,127,79,.22),transparent 70%),#0f1d22}
.vbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.vbar-l{display:flex;align-items:center;gap:10px;color:#fff}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--green);font-size:1.05rem;position:relative}
.logo-mark .wave{font-size:.55rem;position:absolute;right:5px;top:5px;color:var(--teal)}
.vbar-l strong{display:block;font-size:.92rem;font-weight:800;letter-spacing:.01em}
.vsub{font-size:.74rem;opacity:.72}
.vbar-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang-btn{padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font-weight:700;font-size:.78rem;cursor:pointer;transition:.15s}
.lang-btn:hover{background:rgba(255,255,255,.08)}
.lang-btn.active{background:linear-gradient(135deg,#0b7f4f,#0b7f8c);border-color:transparent}
.vclose{width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;text-decoration:none;font-weight:300}
.vclose:hover{background:rgba(255,255,255,.16)}

.vstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 0;gap:14px;min-height:0}
.vframe{position:relative;width:min(900px,94vw);aspect-ratio:16/9;max-height:60vh;border-radius:18px;background:#f7f3e9;box-shadow:0 24px 80px rgba(0,0,0,.45),0 4px 0 rgba(255,255,255,.05) inset;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.scene{position:absolute;inset:0;opacity:0;transform:translateY(8px) scale(.98);transition:opacity .55s ease,transform .55s ease;padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.scene.show{opacity:1;transform:translateY(0) scale(1)}

.vcaption{width:min(900px,94vw);color:#eef6f9;text-align:center;padding:6px 12px}
.vstep{display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:#aee2c5}
.email-pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:rgba(95,217,168,.16);color:#5fd9a8;font-size:.66rem;font-weight:700}
.email-pill.none{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55)}
.vcaption h2{font-size:1.18rem;font-weight:800;margin-bottom:4px;color:#fff}
.vcaption p{font-size:.86rem;opacity:.85;max-width:720px;margin:0 auto;line-height:1.5}

.vctrls{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px 18px;background:transparent}
.vdots{display:flex;gap:6px;margin-right:10px}
.vdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.18s}
.vdot.done{background:rgba(255,255,255,.45)}
.vdot.cur{background:#5fd9a8;width:22px;border-radius:99px}
.vbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.vbtn:hover{background:rgba(255,255,255,.18)}
.vbtn.play{width:46px;height:46px;background:linear-gradient(135deg,#0b7f4f,#0b7f8c);border:none;font-size:1.1rem}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.06)}
.vprog-bar{height:100%;background:linear-gradient(90deg,#0b7f4f,#0b7f8c);width:0;transition:width .1s linear}

/* ─── App-faithful mock pieces ─── */
/* Top bar of in-app */
.app-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:rgba(255,255,255,.94);border-radius:11px;border:1px solid var(--border);box-shadow:0 4px 14px rgba(20,32,26,.06)}
.app-bar-logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--green);font-size:.9rem;position:relative}
.app-bar-logo .wave{font-size:.5rem;position:absolute;right:4px;top:4px;color:var(--teal)}
.app-bar-tabs{display:flex;gap:2px;flex:1;overflow-x:auto}
.app-tab{padding:6px 10px;border-radius:8px;font-size:.74rem;font-weight:700;color:var(--ink2);white-space:nowrap;cursor:pointer}
.app-tab.active{background:#e8f5ec;color:var(--green)}
.app-bar-r{display:flex;gap:6px;align-items:center}
.lang-tag{padding:4px 8px;border:1px solid var(--border);border-radius:99px;font-size:.66rem;font-weight:700;background:#fff}
.signout-btn{padding:5px 10px;border-radius:99px;background:#fff;border:1px solid var(--border);font-size:.7rem;font-weight:700;color:var(--ink);cursor:pointer}
.user-circle{width:30px;height:30px;border-radius:50%;background:#cfd8dc;color:#fff;font-weight:800;font-size:.78rem;display:flex;align-items:center;justify-content:center}

/* Stat pills row */
.stat-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:#fff;border:1.5px solid var(--border);border-radius:11px;padding:8px 10px;text-align:center;cursor:pointer;transition:.15s}
.stat.active{border-color:var(--green);box-shadow:0 0 0 2px rgba(11,127,79,.12)}
.stat .n{font-size:1.05rem;font-weight:900;color:#203f2b}
.stat .l{font-size:.62rem;font-weight:700;color:var(--ink2);margin-top:2px}

/* Listing row */
.listing-row{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fff;border:1px solid var(--border);border-radius:12px}
.plate{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:#17313a;color:#fff;font-weight:900;font-size:.8rem}
.plate-tag{font-size:.6rem;color:rgba(255,255,255,.65);font-weight:700}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:99px;background:#e3f2fd;color:#0d3c6e;font-size:.68rem;font-weight:700}
.row-actions{display:flex;gap:5px;margin-left:auto}
.row-act{padding:5px 10px;border-radius:9px;font-size:.7rem;font-weight:800;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.row-act.report{background:#cfeaf1;color:#0d3c6e}
.row-act.edit{background:#f9d9b0;color:#7a4d12}
.row-act.del{background:#f7c8cc;color:#7a1818}

/* Greeting card */
.greet{display:flex;gap:10px;align-items:center;padding:12px;background:rgba(255,255,255,.85);border:1px solid var(--border);border-radius:12px}
.greet-av{width:34px;height:34px;border-radius:50%;background:#5b6e75;color:#fff;font-weight:800;font-size:.82rem;display:flex;align-items:center;justify-content:center}
.greet h4{font-size:.85rem;color:#203f2b;font-weight:900}
.greet p{font-size:.72rem;color:var(--ink2);margin-top:1px}

/* Page heading */
.ph-row{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ph-row h2{font-size:1rem;color:#203f2b;font-weight:900;display:inline-flex;align-items:center;gap:6px}
.ph-row p{font-size:.7rem;color:var(--ink2);margin-top:1px}
.add-btn{padding:7px 12px;border-radius:10px;background:var(--grad);color:#fff;font-size:.74rem;font-weight:800;border:none;display:inline-flex;align-items:center;gap:4px;box-shadow:0 4px 12px rgba(11,127,79,.25)}

/* Modal */
.modal{position:absolute;inset:14px;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(20,32,26,.18);padding:14px;display:flex;flex-direction:column;gap:8px;animation:popIn .4s ease;z-index:15;overflow:auto}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal h3{font-size:.92rem;color:#203f2b}
.input{padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:.74rem;width:100%;color:var(--ink)}
.lab{font-size:.68rem;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{padding:7px 12px;border-radius:9px;background:var(--grad);color:#fff;font-size:.72rem;font-weight:800;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:4px;text-decoration:none;box-shadow:0 4px 10px rgba(11,127,79,.2)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);box-shadow:none}
.btn.warn{background:linear-gradient(135deg,#d9b45a,#b08838)}

/* Banners */
.banner{padding:9px 12px;border-radius:11px;font-size:.74rem;display:flex;gap:8px;align-items:center}
.banner.warn{background:linear-gradient(135deg,#fff8e1,#fffde7);border-left:4px solid var(--yellow);color:#7a5a00}
.banner.ok{background:#e8f5ec;color:#1b5634;border-left:4px solid var(--green)}
.banner.info{background:#e3f2fd;color:#0d3c6e;border-left:4px solid var(--blue)}
.banner.red{background:#fde8e8;color:#7a1818;border-left:4px solid var(--red)}

/* Pills */
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.66rem;font-weight:800;white-space:nowrap}
.pill.green{background:#e8f5ec;color:var(--green)}
.pill.warn{background:#fff8e1;color:#7a5a00}
.pill.red{background:#fde8e8;color:var(--red)}
.pill.blue{background:#e3f2fd;color:var(--blue)}
.pill.gray{background:#eceff1;color:var(--ink2)}

/* Login welcome scene */
.welcome-card{background:rgba(255,255,255,.94);border-radius:14px;padding:14px;border:1px solid var(--border);box-shadow:0 12px 30px rgba(20,32,26,.12)}
.welcome-brand{display:flex;align-items:center;gap:10px}
.welcome-logo{width:48px;height:48px;border-radius:11px;background:linear-gradient(135deg,#1a3c2a,#0b7f4f);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:1rem}
.welcome-h1{font-size:1.05rem;font-weight:900;color:#203f2b;font-family:Georgia,serif}
.welcome-sub{font-size:.7rem;color:var(--teal);font-weight:700}
.hero-quote{padding:8px 12px;border-radius:10px;background:linear-gradient(135deg,#e8f5ec,#f7f3e9);border:1px solid var(--border);font-size:.72rem;color:#203f2b;line-height:1.4}
.miss-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.miss-card{padding:8px;border-radius:9px;background:#fff;border:1px solid var(--border);font-size:.66rem;line-height:1.3}
.miss-icon{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;margin-bottom:3px;font-size:.85rem}
.miss-icon.green{background:#e8f5ec}.miss-icon.warn{background:#fff8e1}.miss-icon.peach{background:#ffe6cc}.miss-icon.blue{background:#e3f2fd}
.miss-card strong{display:block;color:#203f2b;font-size:.7rem;font-weight:800;margin-bottom:1px}
.rules-block{padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.86);border:1px solid var(--border);font-size:.66rem;color:var(--ink)}
.rules-block strong{display:block;color:#203f2b;font-weight:800;margin-bottom:3px;font-size:.72rem}
.rules-block ul{padding-left:14px}
.first-access{background:#fff8e1;border-left:3px solid var(--yellow);padding:7px 10px;border-radius:8px;font-size:.66rem;color:#7a5a00;line-height:1.4}
.gbtn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;font-weight:800;color:var(--ink);font-size:.74rem;box-shadow:0 4px 12px rgba(20,32,26,.08)}
.gbtn-icon{width:14px;height:14px;border-radius:50%;background:conic-gradient(from 0deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0 100%)}

/* Help/topics page */
.help-search{padding:8px 12px;border-radius:11px;background:rgba(255,255,255,.94);border:1px solid var(--border);font-size:.78rem;color:var(--ink2);display:flex;align-items:center;gap:6px}
.cat-row{display:flex;gap:6px;flex-wrap:wrap}
.cat{padding:6px 14px;border-radius:99px;border:1px solid var(--border);background:#fff;font-size:.72rem;font-weight:800;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.cat.active{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(11,127,79,.25)}
.help-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.help-card{display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:11px;background:#fff;border:1px solid var(--border);font-size:.7rem}
.help-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0}
.help-icon.peach{background:#ffe1d2}.help-icon.warn{background:#fff8e1}.help-icon.blue{background:#e3f2fd}.help-icon.green{background:#e8f5ec}.help-icon.gray{background:#eceff1}
.help-card strong{display:block;color:#203f2b;font-weight:900;font-size:.74rem;margin-bottom:1px}
.help-card span{font-size:.64rem;color:var(--ink2);line-height:1.3}

.hl{position:relative}
.hl::after{content:'';position:absolute;inset:-3px;border:2px solid #5fd9a8;border-radius:14px;pointer-events:none;animation:pulseRing 1.6s ease-in-out infinite}
@keyframes pulseRing{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}

/* Final CTA */
.s-final{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;height:100%;text-align:center;padding:18px}
.s-final h2{font-size:1.4rem;color:#203f2b;font-weight:900}
.s-final p{font-size:.84rem;color:var(--ink2);max-width:520px}

@media(max-width:640px){
  .vstage{padding:10px 10px 0}
  .vframe{aspect-ratio:4/3;max-height:50vh}
  .vcaption h2{font-size:1.05rem}
  .vcaption p{font-size:.8rem}
  .vbtn{width:34px;height:34px}
  .vbtn.play{width:42px;height:42px}
  .scene{padding:10px}
  .stat-row{grid-template-columns:repeat(5,1fr)}
  .miss-grid{grid-template-columns:repeat(2,1fr)}
  .help-grid{grid-template-columns:1fr}
  .vsub{display:none}
}
</style>
</head>
<body class="lang-es">
<div class="stage">
  <header class="vbar">
    <div class="vbar-l">
      <div class="logo-mark">K<span class="wave">~</span></div>
      <div>
        <strong>KAI Airbnb Owners</strong><br/>
        <span class="vsub" data-lang-es>Tour rápido · ~90s · Propietario estándar</span><span class="vsub" data-lang-en>Quick tour · ~90s · Standard owner</span>
      </div>
    </div>
    <div class="vbar-r">
      <button class="lang-btn active" data-set-lang="es">ES</button>
      <button class="lang-btn" data-set-lang="en">EN</button>
      <a href="/" class="vclose" title="Cerrar / Close">×</a>
    </div>
  </header>

  <main class="vstage">
    <div class="vframe" id="vframe"></div>
    <div class="vcaption">
      <div style="margin-bottom:6px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap">
        <span class="vstep" id="vstep">1 / 8</span>
        <span class="email-pill" id="vemail"></span>
      </div>
      <h2 id="vtitle"></h2>
      <p id="vbody"></p>
    </div>
  </main>

  <footer class="vctrls">
    <div class="vdots" id="vdots"></div>
    <button class="vbtn" id="vprev" title="Anterior / Previous">‹</button>
    <button class="vbtn play" id="vplay" title="Pausar / Pause">⏸</button>
    <button class="vbtn" id="vnext" title="Siguiente / Next">›</button>
  </footer>

  <div class="vprog"><div class="vprog-bar" id="vprogbar"></div></div>
</div>

<script>
const SCENES = [
  {
    title: { es: 'Bienvenida e ingreso con Google', en: 'Welcome and Google sign-in' },
    body:  { es: 'La pantalla de inicio te da contexto: misión de la comunidad, reglas de participación y un aviso sobre el primer acceso. Inicia sesión con Google para continuar.',
             en: 'The login screen sets context: community mission, engagement rules, and a first-access notice. Sign in with Google to continue.' },
    duration: 13000,
    email: { es: 'Sin email todavía', en: 'No email yet', none:true },
    html: `
      <div class="welcome-card" style="height:100%;display:flex;flex-direction:column;gap:8px">
        <div class="welcome-brand"><div class="welcome-logo">M·K</div><div><div class="welcome-h1"><span data-lang-es>Bienvenido a Morros KAI</span><span data-lang-en>Welcome to Morros KAI</span></div><div class="welcome-sub">Morros Kai · Cartagena · Colombia</div></div></div>
        <div class="hero-quote"><span data-lang-es>"Estamos construyendo una comunidad de propietarios comprometidos con la excelencia operativa, el cuidado de la propiedad y una mejor experiencia para los huéspedes."</span><span data-lang-en>"We are building a community of owners committed to operational excellence, property care, and a better guest experience."</span></div>
        <div class="miss-grid">
          <div class="miss-card"><div class="miss-icon green">🏠</div><strong><span data-lang-es>Gestión central</span><span data-lang-en>Centralized mgmt</span></strong><span data-lang-es>Apartamentos, contactos y emails en un lugar.</span><span data-lang-en>Apartments, contacts and emails in one place.</span></div>
          <div class="miss-card"><div class="miss-icon warn">⚠️</div><strong><span data-lang-es>Reportes claros</span><span data-lang-en>Transparent reports</span></strong><span data-lang-es>Documenta incidentes para que el responsable actúe.</span><span data-lang-en>Document incidents so the right owner acts.</span></div>
          <div class="miss-card"><div class="miss-icon peach">🤝</div><strong><span data-lang-es>Colaboración</span><span data-lang-en>Collaboration</span></strong><span data-lang-es>Comparte info útil entre propietarios.</span><span data-lang-en>Share useful info between owners.</span></div>
          <div class="miss-card"><div class="miss-icon blue">📊</div><strong><span data-lang-es>Mejora continua</span><span data-lang-en>Continuous improvement</span></strong><span data-lang-es>Datos y tendencias para servir mejor.</span><span data-lang-en>Data and trends for better service.</span></div>
        </div>
        <div class="rules-block"><strong>📌 <span data-lang-es>Reglas de participación</span><span data-lang-en>Engagement rules</span></strong><ul><li><span data-lang-es>Reportes con información clara y verificable.</span><span data-lang-en>Reports with clear, verifiable info.</span></li><li><span data-lang-es>Plataforma para uso respetuoso y constructivo.</span><span data-lang-en>Respectful and constructive use.</span></li></ul></div>
        <div class="first-access">⏳ <strong><span data-lang-es>Primer acceso:</span><span data-lang-en>First access:</span></strong> <span data-lang-es>al ingresar por primera vez debes registrar al menos una propiedad. Tu solicitud quedará pendiente hasta su aprobación.</span><span data-lang-en>on first sign-in you must register at least one property. Your request stays pending until approval.</span></div>
        <div style="display:flex;justify-content:center"><div class="gbtn hl"><div class="gbtn-icon"></div><span data-lang-es>Continuar con Google</span><span data-lang-en>Continue with Google</span></div></div>
      </div>`
  },
  {
    title: { es: 'Registro de propietario', en: 'Owner registration' },
    body:  { es: 'La primera vez completas un formulario corto: país, teléfono de contacto con código de país, y los datos del Listing #1 (apartamento, habitaciones, capacidad, operador opcional). Recibirás un correo de confirmación.',
             en: 'First time, you fill a short form: country, contact phone with country code, and Listing #1 details (apt, rooms, guests, optional operator). You\'ll receive a confirmation email.' },
    duration: 14000,
    email: { es: '📧 Tú recibes: registration_submitted', en: '📧 You receive: registration_submitted' },
    html: `

const frame=document.getElementById('vframe'),stepEl=document.getElementById('vstep'),emailEl=document.getElementById('vemail'),titleEl=document.getElementById('vtitle'),bodyEl=document.getElementById('vbody'),dotsEl=document.getElementById('vdots'),progBar=document.getElementById('vprogbar'),playBtn=document.getElementById('vplay'),prevBtn=document.getElementById('vprev'),nextBtn=document.getElementById('vnext');
let cur=0,playing=true,sceneStart=0,raf=null;
function buildScenes(){SCENES.forEach((s,i)=>{const el=document.createElement('div');el.className='scene';el.innerHTML=s.html;frame.appendChild(el);const dot=document.createElement('div');dot.className='vdot';dot.addEventListener('click',()=>go(i));dotsEl.appendChild(dot);});}
function render(){document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('show',i===cur));document.querySelectorAll('.vdot').forEach((el,i)=>{el.classList.toggle('cur',i===cur);el.classList.toggle('done',i<cur);});stepEl.textContent=`${cur+1} / ${SCENES.length}`;const lang=document.body.classList.contains('lang-en')?'en':'es';titleEl.textContent=SCENES[cur].title[lang];bodyEl.textContent=SCENES[cur].body[lang];const em=SCENES[cur].email;if(em){emailEl.textContent=em[lang];emailEl.classList.toggle('none',!!em.none);emailEl.style.display='inline-flex';}else{emailEl.style.display='none';}}
function go(i){cur=(i+SCENES.length)%SCENES.length;sceneStart=performance.now();progBar.style.width='0%';render();}
function tick(now){if(!playing){raf=requestAnimationFrame(tick);return;}const dur=SCENES[cur].duration;const elapsed=now-sceneStart;progBar.style.width=Math.min(100,(elapsed/dur)*100)+'%';if(elapsed>=dur){if(cur===SCENES.length-1){playing=false;playBtn.textContent='↻';}else go(cur+1);}raf=requestAnimationFrame(tick);}
function togglePlay(){playing=!playing;if(!playing){playBtn.textContent='▶';}else{if(cur===SCENES.length-1&&progBar.style.width==='100%'){go(0);}else{sceneStart=performance.now()-(parseFloat(progBar.style.width)/100)*SCENES[cur].duration;}playBtn.textContent='⏸';}}
playBtn.addEventListener('click',togglePlay);prevBtn.addEventListener('click',()=>go(cur-1));nextBtn.addEventListener('click',()=>go(cur+1));
document.querySelectorAll('[data-set-lang]').forEach(b=>{b.addEventListener('click',()=>{const l=b.dataset.setLang;document.body.classList.toggle('lang-es',l==='es');document.body.classList.toggle('lang-en',l==='en');document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x.dataset.setLang===l));render();});});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);else if(e.key==='ArrowLeft')go(cur-1);else if(e.key===' '){e.preventDefault();togglePlay();}else if(e.key==='Escape')location.href='/';});
const urlLang=new URLSearchParams(location.search).get('lang');
if(urlLang==='en'||((navigator.language||'').toLowerCase().startsWith('en')&&urlLang!=='es')){document.body.classList.remove('lang-es');document.body.classList.add('lang-en');document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active',x.dataset.setLang==='en'));}
buildScenes();go(0);raf=requestAnimationFrame(tick);
</script>
