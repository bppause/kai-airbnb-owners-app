<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>KAI Airbnb Owners · Tour completo / Full tour</title>
<style>
:root{
  --green:#0b7f4f;--teal:#0b7f8c;--ink:#17313a;--ink2:#235f72;--bg:#f7f3e9;
  --card:#fff;--border:rgba(47,79,58,.16);--yellow:#d9b45a;--red:#c62828;
  --grad:linear-gradient(135deg,#0b7f4f,#0b7f8c);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0f1d22;color:var(--ink);overflow:hidden}
[data-lang-es],[data-lang-en]{display:none}
body.lang-es [data-lang-es]{display:inline}
body.lang-en [data-lang-en]{display:inline}

.stage{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 30% 20%,rgba(11,127,140,.25),transparent 70%),radial-gradient(900px 500px at 80% 80%,rgba(11,127,79,.22),transparent 70%),#0f1d22}

.vbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.vbar-l{display:flex;align-items:center;gap:10px;color:#fff}
.logo-mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#e7fff7,#d8f2f5);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--green);font-size:1.05rem;position:relative}
.logo-mark .wave{font-size:.55rem;position:absolute;right:5px;top:5px;color:var(--teal)}
.vbar-l strong{display:block;font-size:.92rem;font-weight:800;letter-spacing:.01em}
.vsub{font-size:.74rem;opacity:.72}
.vbar-r{margin-left:auto;display:flex;gap:8px;align-items:center}
.lang-btn{padding:6px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;font-weight:700;font-size:.78rem;cursor:pointer;transition:.15s}
.lang-btn:hover{background:rgba(255,255,255,.08)}
.lang-btn.active{background:linear-gradient(135deg,#0b7f4f,#0b7f8c);border-color:transparent}
.vclose{width:34px;height:34px;border-radius:99px;background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.3rem;text-decoration:none;font-weight:300}
.vclose:hover{background:rgba(255,255,255,.16)}

.vstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 18px 0;gap:14px;min-height:0}
.vframe{position:relative;width:min(820px,94vw);aspect-ratio:16/9;max-height:58vh;border-radius:18px;background:#f7f3e9;box-shadow:0 24px 80px rgba(0,0,0,.45),0 4px 0 rgba(255,255,255,.05) inset;overflow:hidden;border:1px solid rgba(255,255,255,.08)}
.scene{position:absolute;inset:0;opacity:0;transform:translateY(8px) scale(.98);transition:opacity .55s ease,transform .55s ease;padding:18px;display:flex;flex-direction:column;gap:10px}
.scene.show{opacity:1;transform:translateY(0) scale(1)}

.vcaption{width:min(820px,94vw);color:#eef6f9;text-align:center;padding:6px 12px}
.vstep{display:inline-block;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px;color:#aee2c5}
.vcaption h2{font-size:1.2rem;font-weight:800;margin-bottom:4px;color:#fff}
.vcaption p{font-size:.88rem;opacity:.85;max-width:680px;margin:0 auto;line-height:1.5}

.vctrls{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 16px 18px;background:transparent}
.vdots{display:flex;gap:6px;margin-right:10px;flex-wrap:wrap;max-width:60vw;justify-content:center}
.vdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.22);cursor:pointer;transition:.18s}
.vdot.done{background:rgba(255,255,255,.45)}
.vdot.cur{background:#5fd9a8;width:22px;border-radius:99px}
.vbtn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.vbtn:hover{background:rgba(255,255,255,.18)}
.vbtn.play{width:46px;height:46px;background:linear-gradient(135deg,#0b7f4f,#0b7f8c);border:none;font-size:1.1rem}
.vbtn.play:hover{filter:brightness(1.1)}
.vprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(0,0,0,.06)}
.vprog-bar{height:100%;background:linear-gradient(90deg,#0b7f4f,#0b7f8c);width:0;transition:width .1s linear}

/* Mock UI */
.m-card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:0 6px 18px rgba(32,46,38,.06)}
.m-row{display:flex;gap:10px;align-items:center}
.m-col{display:flex;flex-direction:column;gap:8px}
.m-title{font-size:.95rem;font-weight:900;color:#203f2b}
.m-sub{font-size:.74rem;color:var(--ink2)}
.m-pill{display:inline-block;padding:3px 10px;border-radius:99px;background:#e8f5ec;color:var(--green);font-size:.7rem;font-weight:800}
.m-pill.warn{background:#fff8e1;color:#7a5a00}
.m-pill.red{background:#fde8e8;color:var(--red)}
.m-pill.blue{background:#e3f2fd;color:#0d3c6e}
.m-btn{padding:8px 14px;border-radius:10px;background:var(--grad);color:#fff;font-size:.78rem;font-weight:800;border:none;display:inline-flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(11,127,79,.25);text-decoration:none}
.m-btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--border);box-shadow:none}
.m-btn.wa{background:#25d366;box-shadow:0 4px 12px rgba(37,211,102,.3)}
.m-input{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:#fff;font-size:.78rem;width:100%}
.m-banner{padding:10px 12px;border-radius:11px;background:linear-gradient(135deg,#fff8e1,#fffde7);border-left:4px solid var(--yellow);font-size:.78rem;color:#7a5a00;display:flex;gap:8px;align-items:center}
.m-banner.ok{background:#e8f5ec;color:#1b5634;border-left-color:var(--green)}
.m-plate{display:inline-flex;align-items:center;justify-content:center;width:54px;height:34px;border-radius:7px;background:#17313a;color:#fff;font-weight:900;font-size:.82rem;letter-spacing:.04em;cursor:pointer}
.m-plate.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(95,217,168,.7)}50%{box-shadow:0 0 0 10px rgba(95,217,168,0)}}
.m-tab{padding:8px 14px;font-size:.78rem;font-weight:700;color:var(--ink2);border-bottom:2px solid transparent;cursor:pointer}
.m-tab.active{color:var(--green);border-bottom-color:var(--green)}
.m-list{display:flex;flex-direction:column;gap:8px}
.m-listing{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:11px;background:#fff}
.m-popup{position:absolute;background:#fff;border-radius:14px;border:1px solid var(--border);padding:14px;box-shadow:0 18px 40px rgba(20,32,26,.18);max-width:340px;font-size:.78rem;z-index:20;animation:popIn .35s ease}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
.m-pop-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--border);font-size:.75rem}
.m-pop-row:last-child{border-bottom:none}
.m-pop-link{color:var(--teal);font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.m-modal{position:absolute;inset:14px;background:#fff;border-radius:14px;box-shadow:0 18px 40px rgba(20,32,26,.18);padding:16px;display:flex;flex-direction:column;gap:10px;animation:popIn .4s ease;z-index:15}
.m-modal h3{font-size:.95rem;color:#203f2b}
.m-bell{width:34px;height:34px;border-radius:50%;background:#fff8e1;display:flex;align-items:center;justify-content:center;font-size:1.1rem;position:relative}
.m-bell-dot{position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.m-google{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;background:#fff;border:1px solid var(--border);border-radius:11px;font-weight:800;color:var(--ink);box-shadow:0 4px 14px rgba(20,32,26,.08)}
.m-g-icon{width:18px;height:18px;border-radius:50%;background:conic-gradient(from 0deg,#4285f4 0 25%,#34a853 0 50%,#fbbc05 0 75%,#ea4335 0 100%)}
.m-toggle{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;color:var(--ink2);font-weight:700}
.m-toggle .sw{width:30px;height:18px;border-radius:99px;background:var(--green);position:relative}
.m-toggle .sw::after{content:'';position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.m-toggle.off .sw{background:#cfd8dc}
.m-toggle.off .sw::after{right:auto;left:2px}
.m-timer{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;background:#fff8e1;color:#7a5a00;font-size:.74rem;font-weight:800}
.m-bar{height:6px;border-radius:99px;background:#e8eef0;overflow:hidden}
.m-bar > div{height:100%;background:linear-gradient(90deg,#0b7f4f,#0b7f8c)}

/* Layouts */
.s-login{display:flex;align-items:center;justify-content:center;gap:24px;height:100%}
.s-login .login-card{width:300px;padding:18px;text-align:center;background:#fff;border-radius:18px;border:1px solid var(--border);box-shadow:0 12px 28px rgba(20,32,26,.12)}
.s-login .login-card .badge{display:inline-block;padding:3px 10px;background:#e8f5ec;color:var(--green);border-radius:99px;font-size:.66rem;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.06em}
.s-login .login-card h3{font-size:1rem;color:#203f2b;margin-bottom:4px}
.s-login .login-card p{font-size:.74rem;color:var(--ink2);margin-bottom:14px}
.s-final{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;height:100%;text-align:center;padding:20px}
.s-final h2{font-size:1.5rem;color:#203f2b;font-weight:900}
.s-final p{font-size:.88rem;color:var(--ink2);max-width:480px}
.s-final .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.hl{position:relative}
.hl::after{content:'';position:absolute;inset:-4px;border:2px solid #5fd9a8;border-radius:14px;pointer-events:none;animation:pulseRing 1.6s ease-in-out infinite}
@keyframes pulseRing{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}

@media(max-width:640px){
  .vstage{padding:10px 10px 0}
  .vframe{aspect-ratio:4/3;max-height:50vh}
  .vcaption h2{font-size:1.05rem}
  .vcaption p{font-size:.82rem}
  .vbtn{width:34px;height:34px}
  .vbtn.play{width:42px;height:42px}
  .scene{padding:12px}
  .vsub{display:none}
}
</style>
</head>
<body class="lang-es">
<div class="stage">

    <div class="vbar-l">

      <button class="lang-btn active" data-set-lang="es">ES</button>

</div>

    html: `

const frame = document.getElementById('vframe');
const stepEl = document.getElementById('vstep');
const titleEl = document.getElementById('vtitle');
const bodyEl = document.getElementById('vbody');
const dotsEl = document.getElementById('vdots');
const progBar = document.getElementById('vprogbar');
const playBtn = document.getElementById('vplay');
const prevBtn = document.getElementById('vprev');
const nextBtn = document.getElementById('vnext');

let cur = 0, playing = true, sceneStart = 0, raf = null;

function buildScenes(){
  SCENES.forEach((s,i)=>{
    const el = document.createElement('div');
    el.className = 'scene';
    el.dataset.idx = i;
    el.innerHTML = s.html;
    frame.appendChild(el);
    const dot = document.createElement('div');
    dot.className = 'vdot';
    dot.addEventListener('click', ()=>go(i));
    dotsEl.appendChild(dot);
  });
}
function render(){
  document.querySelectorAll('.scene').forEach((el,i)=>el.classList.toggle('show', i===cur));
  document.querySelectorAll('.vdot').forEach((el,i)=>{
    el.classList.toggle('cur', i===cur);
    el.classList.toggle('done', i<cur);
  });
  stepEl.textContent = `${cur+1} / ${SCENES.length}`;
  const lang = document.body.classList.contains('lang-en') ? 'en' : 'es';
  titleEl.textContent = SCENES[cur].title[lang];
  bodyEl.textContent = SCENES[cur].body[lang];
}
function go(i){
  cur = (i+SCENES.length)%SCENES.length;
  sceneStart = performance.now();
  progBar.style.width = '0%';
  render();
}
function tick(now){
  if (!playing) { raf = requestAnimationFrame(tick); return; }
  const dur = SCENES[cur].duration;
  const elapsed = now - sceneStart;
  progBar.style.width = Math.min(100, (elapsed/dur)*100) + '%';
  if (elapsed >= dur) {
    if (cur === SCENES.length-1) { playing = false; playBtn.textContent = '↻'; }
    else go(cur+1);
  }
  raf = requestAnimationFrame(tick);
}
function togglePlay(){
  playing = !playing;
  if (!playing) { playBtn.textContent = '▶'; }
  else {
    if (cur === SCENES.length-1 && progBar.style.width === '100%') { go(0); }
    else { sceneStart = performance.now() - (parseFloat(progBar.style.width)/100)*SCENES[cur].duration; }
    playBtn.textContent = '⏸';
  }
}
playBtn.addEventListener('click', togglePlay);
prevBtn.addEventListener('click', ()=>go(cur-1));
nextBtn.addEventListener('click', ()=>go(cur+1));
document.querySelectorAll('[data-set-lang]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const l = b.dataset.setLang;
    document.body.classList.toggle('lang-es', l==='es');
    document.body.classList.toggle('lang-en', l==='en');
    document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active', x.dataset.setLang===l));
    render();
  });
});
document.addEventListener('keydown', e=>{
  if (e.key === 'ArrowRight') go(cur+1);
  else if (e.key === 'ArrowLeft') go(cur-1);
  else if (e.key === ' ') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'Escape') location.href = '/';
});

const urlLang = new URLSearchParams(location.search).get('lang');
if (urlLang === 'en' || ((navigator.language||'').toLowerCase().startsWith('en') && urlLang!=='es')) {
  document.body.classList.remove('lang-es');
  document.body.classList.add('lang-en');
  document.querySelectorAll('.lang-btn').forEach(x=>x.classList.toggle('active', x.dataset.setLang==='en'));
}

buildScenes();
go(0);
raf = requestAnimationFrame(tick);
</script>
